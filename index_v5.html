<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#FF2D4B;--orange:#FF6B1A;--yellow:#FFD700;--green:#00FF88;--purple:#BF00FF;--cyan:#00EEFF;--darker:#050508;--card:#0A0A18;--text:#F5F5F5;--muted:#6B7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--darker);color:var(--text);min-height:100vh;overflow-x:hidden;}
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:0 0 120px;}
.header{padding:48px 20px 24px;text-align:center;}
.header-mascot{font-size:72px;display:block;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(255,107,26,0.9));}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.header h1{font-family:'Bangers',cursive;font-size:54px;letter-spacing:5px;background:linear-gradient(135deg,var(--red),var(--orange),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin:8px 0 4px;}
.header-sub{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:5px;font-weight:700;}
.day-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.35);border-radius:20px;padding:7px 20px;font-size:15px;font-weight:900;color:var(--yellow);margin-top:16px;}
.section-title{font-family:'Bangers',cursive;font-size:18px;letter-spacing:3px;text-transform:uppercase;padding:0 20px 14px;display:flex;align-items:center;gap:10px;color:var(--muted);}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(255,45,75,0.4),transparent);}
.cards{padding:0 16px;display:flex;flex-direction:column;gap:16px;margin-bottom:32px;}
.card{background:var(--card);border-radius:24px;border:1px solid rgba(255,255,255,0.06);overflow:hidden;}
.card.validated{border-color:rgba(0,255,136,0.2);box-shadow:0 0 20px rgba(0,255,136,0.05);}
.card-band{height:3px;}
.card-cover{height:72px;display:flex;align-items:center;padding:0 20px;gap:14px;position:relative;}
.player-name-big{font-family:'Bangers',cursive;font-size:26px;letter-spacing:2px;}
.card-body{padding:14px 20px 18px;}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:900;}
.pill-streak{background:rgba(255,107,26,0.1);border:1px solid rgba(255,107,26,0.3);color:var(--orange);}
.challenge-box{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:16px;margin-bottom:14px;}
.challenge-name{font-weight:900;font-size:17px;line-height:1.4;margin-bottom:8px;}
.spice-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,0.06);}
.card-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.done-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.check-box{width:36px;height:36px;border-radius:12px;border:2px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}
.check-box.checked{background:var(--green);border-color:var(--green);box-shadow:0 0 24px rgba(0,255,136,0.6);}
.btn-reroll{background:rgba(191,0,255,0.08);border:1px solid rgba(191,0,255,0.35);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:900;color:#e879f9;cursor:pointer;font-family:'Nunito',sans-serif;}
.btn-reroll:disabled{opacity:0.3;cursor:not-allowed;}
.divider{height:1px;background:linear-gradient(to right,transparent,rgba(255,45,75,0.2),transparent);margin:28px 16px;}
.reveal-phase{padding:0 16px;}
.reveal-progress{display:flex;justify-content:center;gap:12px;padding:16px 0;}
.progress-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.15);}
.progress-dot.done{background:rgba(255,255,255,0.4);}
.progress-dot.active{width:14px;height:14px;background:var(--yellow);box-shadow:0 0 10px rgba(255,215,0,0.6);}
.reveal-card{background:var(--card);border-radius:24px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin-bottom:16px;}
.reveal-cover{padding:28px 24px 20px;text-align:center;}
.reveal-step{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin-bottom:8px;}
.reveal-emoji-big{font-size:64px;display:block;margin:8px 0;}
.reveal-player-name{font-family:'Bangers',cursive;font-size:36px;letter-spacing:3px;margin-bottom:4px;}
.reveal-body{padding:0 20px 20px;}
.reveal-challenge-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:16px;margin-bottom:14px;}
.reveal-challenge-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
.reveal-challenge-name{font-weight:900;font-size:18px;line-height:1.4;margin-bottom:8px;}
.reveal-power-box{border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid;}
.reveal-power-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;opacity:0.7;}
.reveal-power-name{font-family:'Bangers',cursive;font-size:28px;letter-spacing:2px;margin-bottom:6px;}
.reveal-power-desc{font-size:13px;line-height:1.5;opacity:0.8;}
.target-section{margin-bottom:14px;}
.target-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700;}
.target-grid{display:flex;flex-direction:column;gap:8px;}
.target-btn{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;font-size:14px;color:var(--text);width:100%;text-align:left;}
.target-btn.selected{border-color:var(--green);background:rgba(0,255,136,0.08);}
.upgrade-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.upgrade-btn{border:none;border-radius:14px;padding:14px;font-family:'Bangers',cursive;font-size:17px;cursor:pointer;opacity:0.6;}
.upgrade-btn.selected{opacity:1;}
.reveal-actions{display:flex;flex-direction:column;gap:10px;}
.btn-activate{background:linear-gradient(135deg,var(--orange),var(--red));border:none;border-radius:14px;padding:16px;font-family:'Bangers',cursive;font-size:20px;letter-spacing:2px;color:white;cursor:pointer;}
.btn-skip-reveal{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:12px;font-family:'Bangers',cursive;font-size:16px;color:var(--muted);cursor:pointer;}
.btn-reroll-reveal{background:rgba(191,0,255,0.08);border:1px solid rgba(191,0,255,0.35);border-radius:14px;padding:10px;font-family:'Bangers',cursive;font-size:14px;color:#e879f9;cursor:pointer;}
.effect-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 14px;margin-bottom:6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
.shield-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.shield-modal{background:#060620;border:2px solid var(--cyan);border-radius:28px;padding:32px 24px;width:100%;max-width:400px;text-align:center;}
.shield-big-icon{font-size:64px;display:block;margin-bottom:12px;}
.shield-pass-to{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:3px;margin-bottom:4px;}
.shield-player-name{font-family:'Bangers',cursive;font-size:40px;margin-bottom:8px;}
.shield-desc{font-size:14px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:20px;}
.shield-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.shield-yes-btn{background:linear-gradient(135deg,var(--cyan),var(--green));border:none;border-radius:14px;padding:16px;font-family:'Bangers',cursive;font-size:20px;color:#000;cursor:pointer;}
.shield-no-btn{background:rgba(255,45,75,0.12);border:1.5px solid rgba(255,45,75,0.4);border-radius:14px;padding:16px;font-family:'Bangers',cursive;font-size:20px;color:var(--red);cursor:pointer;}
.collapsible-card{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);margin:0 16px 16px;}
.collapsible-header{padding:18px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.collapsible-header h3{font-family:'Bangers',cursive;font-size:18px;letter-spacing:2px;}
.collapsible-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease;}
.collapsible-body.open{max-height:2000px;}
.collapsible-inner{padding:0 20px 20px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;display:block;}
.form-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px 14px;color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;outline:none;}
.form-input:focus{border-color:var(--green);}
.spice-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.spice-option{display:none;}
.spice-option+label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:rgba(255,255,255,0.02);border:2px solid rgba(255,255,255,0.05);border-radius:12px;cursor:pointer;font-size:10px;font-weight:700;text-align:center;}
.spice-option:checked+label{border-color:var(--green);background:rgba(0,255,136,0.06);}
.spice-emoji{font-size:22px;}
.btn-suggest{width:100%;background:linear-gradient(135deg,rgba(0,255,136,0.15),rgba(0,238,255,0.08));border:1px solid rgba(0,255,136,0.35);border-radius:12px;padding:14px;font-family:'Bangers',cursive;font-size:18px;letter-spacing:2px;color:var(--green);cursor:pointer;}
.btn-suggest:disabled{opacity:0.4;cursor:not-allowed;}
.rule-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.rule-item:last-child{border-bottom:none;}
.rule-icon{font-size:22px;flex-shrink:0;}
.rule-title{font-weight:900;font-size:14px;margin-bottom:3px;}
.rule-desc{font-size:12px;color:var(--muted);line-height:1.5;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;position:relative;z-index:2;}
.spinner{width:48px;height:48px;border:2px solid rgba(255,45,75,0.15);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:3px;font-size:11px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);color:white;font-weight:900;padding:14px 28px;border-radius:50px;font-size:14px;z-index:9999;transition:transform 0.4s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.leaderboard{padding:0 16px;}
.lb-card{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);}
.lb-header-row{display:grid;grid-template-columns:40px 1fr 60px 60px 50px;gap:8px;padding:10px 16px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.04);}
.lb-header-row span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:center;font-weight:700;}
.lb-header-row span:nth-child(2){text-align:left;}
.lb-row{display:grid;grid-template-columns:40px 1fr 60px 60px 50px;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.03);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{font-family:'Bangers',cursive;font-size:20px;text-align:center;}
.lb-name{font-weight:900;font-size:14px;}
.lb-stat{text-align:center;}
.lb-val{font-weight:900;font-size:15px;}
.lb-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;}
</style>
</head>
<body>
<canvas id="particle-canvas"></canvas>
<div class="app">
<div id="root"><div class="loading"><div class="spinner"></div><p>Loading...</p></div></div>
</div>
<div id="shield-container"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var canvas=document.getElementById('particle-canvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var colors=['#FF2D4B','#FF6B1A','#FFD700','#00FF88','#00EEFF','#BF00FF'];
  var particles=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<50;i++){particles.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.5+0.3,color:colors[Math.floor(Math.random()*colors.length)],vx:(Math.random()-0.5)*0.3,vy:-Math.random()*0.4-0.1,alpha:Math.random()*0.5+0.1});}
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color+Math.floor(p.alpha*255).toString(16).padStart(2,'0');ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=canvas.height+5;p.x=Math.random()*canvas.width;}if(p.x<-5)p.x=canvas.width+5;if(p.x>canvas.width+5)p.x=-5;});requestAnimationFrame(draw);}
  draw();
})();

var CONFIG={
  db_system:'354403dde0e380aa85bfe7d9fd139be5',
  db_challenges:'354403dde0e3804f8644d242a0ec6bf6',
  db_assignments:'354403dde0e380f797ccfb85ad5a072e'
};
var PLAYERS=[
  {name:'Banuu',emoji:'\u{1F335}',color:'#00FF88',colorDark:'rgba(0,255,136,0.15)'},
  {name:'Luzz',emoji:'\u{1F525}',color:'#FF2D4B',colorDark:'rgba(255,45,75,0.15)'},
  {name:'Y',emoji:'\u26A1',color:'#FFD700',colorDark:'rgba(255,215,0,0.15)'},
  {name:'Nicooo',emoji:'\u{1F4B0}',color:'#FF6B1A',colorDark:'rgba(255,107,26,0.15)'}
];
var POWERS={
  'Entourloupeur':{color:'#BF00FF',bg:'rgba(191,0,255,0.12)',border:'rgba(191,0,255,0.4)',desc:'Copy someone challenge. Complete it before them to steal their points!',needsTarget:true,targetSelf:false,reactive:false},
  'Swap':{color:'#00EEFF',bg:'rgba(0,238,255,0.1)',border:'rgba(0,238,255,0.4)',desc:'Force a challenge swap with someone.',needsTarget:true,targetSelf:false,reactive:false},
  'Bridage':{color:'#FF2D4B',bg:'rgba(255,45,75,0.1)',border:'rgba(255,45,75,0.4)',desc:'x0.5 points today. Target yourself or someone else.',needsTarget:true,targetSelf:true,reactive:false},
  'Pas si vite':{color:'#FFD700',bg:'rgba(255,215,0,0.1)',border:'rgba(255,215,0,0.4)',desc:'Upgrade or downgrade someone challenge difficulty.',needsTarget:true,targetSelf:false,reactive:false,needsUpDown:true},
  'Shield':{color:'#00EEFF',bg:'rgba(0,238,255,0.08)',border:'rgba(0,238,255,0.3)',desc:'Block any power when targeted. Reactive.',needsTarget:false,reactive:true},
  'Roulette':{color:'#FF6B1A',bg:'rgba(255,107,26,0.1)',border:'rgba(255,107,26,0.4)',desc:'x0, x1 or x2 random at end of day.',needsTarget:false,reactive:true},
  'Copier-Coller':{color:'#00FF88',bg:'rgba(0,255,136,0.1)',border:'rgba(0,255,136,0.4)',desc:'Share your challenge. Both complete it = x2 each!',needsTarget:true,targetSelf:false,reactive:false},
  'Extincteur':{color:'#FF2D4B',bg:'rgba(255,45,75,0.1)',border:'rgba(255,45,75,0.4)',desc:'Reset someone streak to 0.',needsTarget:true,targetSelf:false,reactive:false}
};
var SPICE_PTS={Mild:1,Spicy:2,Hot:3,Atomic:5};

function getPowerKey(pt){
  if(!pt)return null;
  var keys=Object.keys(POWERS);
  for(var i=0;i<keys.length;i++){if(pt.indexOf(keys[i])>=0)return keys[i];}
  return null;
}

var STATE={
  dayCounter:1,systemPageId:null,challenges:{},assignments:[],allChallengeIds:[],
  defiLaunched:false,revealPhase:false,revealOrder:[],revealStep:0,
  effectLog:[],pendingShield:null,selectedTarget:null,selectedUpgradeDir:null
};

function query(dbId){
  return fetch('/api/notion/databases/'+dbId+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json();}).then(function(d){return d.results;});
}
function patch(pageId,props){
  return fetch('/api/notion/pages/'+pageId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({properties:props})}).then(function(r){return r.json();});
}
function notionCreate(dbId,props){
  return fetch('/api/notion/pages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent:{database_id:dbId},properties:props})}).then(function(r){return r.json();});
}
function getProp(page,name,type){
  var p=page.properties[name];
  if(!p)return null;
  if(type==='number')return p.number!=null?p.number:0;
  if(type==='title')return p.title&&p.title[0]?p.title[0].plain_text:'';
  if(type==='checkbox')return p.checkbox===true;
  if(type==='formula_number')return p.formula?p.formula.number||0:0;
  if(type==='formula_string')return p.formula?p.formula.string||'':'';
  if(type==='select')return p.select?p.select.name||'':'';
  if(type==='text')return p.rich_text&&p.rich_text[0]?p.rich_text[0].plain_text:'';
  return null;
}
function showToast(msg,color){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color||'#00FF88';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3000);
}

function loadData(){
  return query(CONFIG.db_system).then(function(sysPages){
    var sys=sysPages[0];
    STATE.systemPageId=sys.id;
    STATE.dayCounter=getProp(sys,'Day_Counter','number')||1;
    STATE.defiLaunched=getProp(sys,'Defis_Launched','checkbox');
    return query(CONFIG.db_challenges);
  }).then(function(chPages){
    STATE.challenges={};STATE.allChallengeIds=[];
    for(var i=0;i<chPages.length;i++){
      var p=chPages[i];
      var id=getProp(p,'ID_Global','number');
      if(!id)continue;
      var pts=getProp(p,'Points','number')||0;
      var name=getProp(p,'Name','title')||'';
      STATE.challenges[id]={id:id,name:name,points:pts,spice:getProp(p,'Spice_Level','formula_string')||getProp(p,'Spice_Level','select')||''};
      STATE.allChallengeIds.push(id);
    }
    return query(CONFIG.db_assignments);
  }).then(function(asgPages){
    STATE.assignments=asgPages.map(function(p){
      return{
        pageId:p.id,
        playerIndex:getProp(p,'Player_Index','number')||0,
        winStreak:getProp(p,'Win_Streak','number')||0,
        totalScore:getProp(p,'Total_Score','number')||0,
        defisReussis:getProp(p,'Defis_Reussis','number')||0,
        isValidated:getProp(p,'Is_Validated','checkbox'),
        challengeId:getProp(p,'Challenge_ID_Today','formula_number')||0,
        hasRerolled:getProp(p,'Has_Rerolled','checkbox'),
        rerollChallengeId:getProp(p,'Reroll_Challenge_ID','number')||0,
        powerType:getProp(p,'Power_Type','select')||'',
        powerTarget:getProp(p,'Power_Target','text')||'',
        powerUsed:getProp(p,'Power_Used','checkbox'),
        rouletteMultiplier:getProp(p,'Roulette_Multiplier','number')||1,
        shieldUsedToday:getProp(p,'Shield_Used_Today','checkbox'),
        effectBridage:false,effectUpgrade:null
      };
    }).sort(function(a,b){return a.playerIndex-b.playerIndex;});

    STATE.effectLog=[];
    STATE.assignments.forEach(function(asg){
      if(!asg.powerUsed)return;
      var pk=getPowerKey(asg.powerType);
      if(!pk)return;
      var pw=POWERS[pk];
      var pl=PLAYERS[asg.playerIndex];
      if(!pw||!pl)return;
      STATE.effectLog.push({msg:pl.emoji+' '+pl.name+' used '+pk+(asg.powerTarget?' on '+asg.powerTarget.split('|')[0]:''),color:pw.color});
      if(pk==='Bridage'){
        var tgt=asg.powerTarget==='myself'?asg:STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===asg.powerTarget;});
        if(tgt)tgt.effectBridage=true;
      }
      if(pk==='Pas si vite'&&asg.powerTarget){
        var parts=asg.powerTarget.split('|');
        var tgt2=STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===parts[0];});
        if(tgt2)tgt2.effectUpgrade=parts[1]||null;
      }
    });

    if(!STATE.defiLaunched){
      var hasPowers=STATE.assignments.some(function(a){return getPowerKey(a.powerType)!==null;});
      if(hasPowers){
        var allDone=STATE.assignments.every(function(a){return a.powerUsed||!getPowerKey(a.powerType);});
        if(!allDone&&!STATE.revealPhase){
          var order=[];
          for(var j=0;j<PLAYERS.length;j++)order.push((j+STATE.dayCounter-1)%PLAYERS.length);
          STATE.revealOrder=order;
          var step=0;
          for(var s=0;s<order.length;s++){
            var asgS=STATE.assignments.find(function(a){return a.playerIndex===order[s];});
            if(asgS&&!asgS.powerUsed&&getPowerKey(asgS.powerType))break;
            step=s+1;
          }
          STATE.revealStep=step;
          STATE.revealPhase=true;
        }
      }
    }
  });
}

function getBaseChallenge(asg){return(asg.rerollChallengeId&&asg.rerollChallengeId>0)?asg.rerollChallengeId:asg.challengeId;}
function getEffectiveChallengeId(asg){
  var playerName=PLAYERS[asg.playerIndex]?PLAYERS[asg.playerIndex].name:null;
  var swapper=STATE.assignments.find(function(a){return a.powerUsed&&getPowerKey(a.powerType)==='Swap'&&a.powerTarget===playerName&&a.playerIndex!==asg.playerIndex;});
  if(swapper)return getBaseChallenge(swapper);
  if(asg.powerUsed&&getPowerKey(asg.powerType)==='Swap'&&asg.powerTarget){
    var tgt=STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===asg.powerTarget;});
    if(tgt)return getBaseChallenge(tgt);
  }
  return getBaseChallenge(asg);
}

function getCurrentRevealAsg(){
  var idx=STATE.revealOrder[STATE.revealStep];
  return STATE.assignments.find(function(a){return a.playerIndex===idx;});
}

window.selectTarget=function(name){
  STATE.selectedTarget=name;
  document.querySelectorAll('.target-btn').forEach(function(b){b.classList.toggle('selected',b.dataset.name===name);});
};
window.selectUpgradeDir=function(dir,btn){
  STATE.selectedUpgradeDir=dir;
  document.querySelectorAll('.upgrade-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
};
window.activatePower=function(){
  var asg=getCurrentRevealAsg();
  var pk=getPowerKey(asg.powerType);
  var pw=POWERS[pk];
  if(pw.needsTarget&&!STATE.selectedTarget){showToast('Select a target!','#FF6B1A');return;}
  if(pw.needsUpDown&&!STATE.selectedUpgradeDir){showToast('Choose upgrade or downgrade!','#FF6B1A');return;}
  var target=STATE.selectedTarget;
  if(target&&target!=='myself'){
    var targetAsg=STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===target;});
    if(targetAsg&&getPowerKey(targetAsg.powerType)==='Shield'&&!targetAsg.powerUsed&&!targetAsg.shieldUsedToday){
      STATE.pendingShield={attackerAsg:asg,targetAsg:targetAsg,target:target,upgradeDir:STATE.selectedUpgradeDir};
      showShieldPrompt(asg,targetAsg);return;
    }
  }
  doActivatePower(asg,target,STATE.selectedUpgradeDir);
};
function showShieldPrompt(attackerAsg,targetAsg){
  var attacker=PLAYERS[attackerAsg.playerIndex];
  var target=PLAYERS[targetAsg.playerIndex];
  document.getElementById('shield-container').innerHTML=
    '<div class="shield-overlay"><div class="shield-modal">'
    +'<span class="shield-big-icon">\u{1F6E1}\uFE0F</span>'
    +'<div class="shield-pass-to">Pass phone to</div>'
    +'<div class="shield-player-name" style="color:'+target.color+'">'+target.emoji+' '+target.name+'</div>'
    +'<div class="shield-desc">'+attacker.emoji+' '+attacker.name+' used '+attackerAsg.powerType+' on you!<br>Activate your Shield?</div>'
    +'<div class="shield-btns">'
    +'<button class="shield-yes-btn" onclick="resolveShield(true)">ACTIVATE!</button>'
    +'<button class="shield-no-btn" onclick="resolveShield(false)">Allow it</button>'
    +'</div></div></div>';
}
window.resolveShield=function(activate){
  document.getElementById('shield-container').innerHTML='';
  var pd=STATE.pendingShield;
  var shieldPl=PLAYERS[pd.targetAsg.playerIndex];
  var attackPl=PLAYERS[pd.attackerAsg.playerIndex];
  if(activate){
    patch(pd.targetAsg.pageId,{Power_Used:{checkbox:true},Shield_Used_Today:{checkbox:true}}).then(function(){
      pd.targetAsg.powerUsed=true;pd.targetAsg.shieldUsedToday=true;
      STATE.effectLog.push({msg:shieldPl.emoji+' '+shieldPl.name+' blocked '+attackPl.name+'!',color:'#00EEFF'});
      showToast('Shield activated!','#00EEFF');
      STATE.pendingShield=null;STATE.selectedTarget=null;STATE.selectedUpgradeDir=null;
      nextRevealStep();
    });
  } else {
    patch(pd.targetAsg.pageId,{Shield_Used_Today:{checkbox:true}}).then(function(){});
    pd.targetAsg.shieldUsedToday=true;
    STATE.pendingShield=null;
    doActivatePower(pd.attackerAsg,pd.target,pd.upgradeDir);
  }
};
function doActivatePower(asg,target,upgradeDir){
  var pk=getPowerKey(asg.powerType);
  var pw=POWERS[pk];
  var pl=PLAYERS[asg.playerIndex];
  var updates={Power_Used:{checkbox:true}};
  if(target)updates.Power_Target={rich_text:[{text:{content:target}}]};
  if(pk==='Extincteur'&&target&&target!=='myself'){
    var tgt=STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===target;});
    if(tgt){patch(tgt.pageId,{Win_Streak:{number:0}}).then(function(){});tgt.winStreak=0;}
    STATE.effectLog.push({msg:pl.emoji+' '+pl.name+' wiped '+target+'s streak!',color:pw.color});
  }
  if(pk==='Bridage'){
    var tgt2=target==='myself'?asg:STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===target;});
    if(tgt2)tgt2.effectBridage=true;
    STATE.effectLog.push({msg:pl.emoji+' '+pl.name+' bridaged '+(target==='myself'?'themselves':target)+'!',color:pw.color});
  }
  if(pk==='Pas si vite'&&target&&upgradeDir){
    var tgt3=STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===target;});
    if(tgt3)tgt3.effectUpgrade=upgradeDir;
    updates.Power_Target={rich_text:[{text:{content:target+'|'+upgradeDir}}]};
    STATE.effectLog.push({msg:pl.emoji+' '+pl.name+' '+upgradeDir+'d '+target+'s challenge!',color:pw.color});
  }
  if(pk==='Roulette'){
    var mult=[0,1,2][Math.floor(Math.random()*3)];
    updates.Roulette_Multiplier={number:mult};asg.rouletteMultiplier=mult;
    STATE.effectLog.push({msg:pl.emoji+' '+pl.name+' rolled x'+mult+'!',color:mult===2?'#00FF88':mult===0?'#FF2D4B':'#FFD700'});
  }
  if(pk==='Entourloupeur'||pk==='Swap'||pk==='Copier-Coller'){
    STATE.effectLog.push({msg:pl.emoji+' '+pl.name+' used '+pk+(target?' on '+target:'')+'!',color:pw.color});
  }
  patch(asg.pageId,updates).then(function(){
    asg.powerUsed=true;asg.powerTarget=target||'';
    STATE.selectedTarget=null;STATE.selectedUpgradeDir=null;
    nextRevealStep();
  });
}
window.skipPower=function(){nextRevealStep();};
function nextRevealStep(){
  STATE.revealStep++;STATE.selectedTarget=null;STATE.selectedUpgradeDir=null;
  if(STATE.revealStep>=STATE.revealOrder.length){
    patch(STATE.systemPageId,{Defis_Launched:{checkbox:true}}).then(function(){
      STATE.defiLaunched=true;STATE.revealPhase=false;
      showToast('All revealed! Lets go!','#00FF88');
      render();
    });
    return;
  }
  render();
}
window.toggleValidation=function(pageId,cur){
  var nv=!cur;
  patch(pageId,{Is_Validated:{checkbox:nv}}).then(function(){
    var a=STATE.assignments.find(function(x){return x.pageId===pageId;});
    if(a)a.isValidated=nv;
    render();
    showToast(nv?'Challenge done!':'Removed',nv?'#00FF88':'#FF2D4B');
  });
};
window.reroll=function(pageId){
  var asg=STATE.assignments.find(function(a){return a.pageId===pageId;});
  if(!asg||asg.hasRerolled)return;
  var current=getEffectiveChallengeId(asg);
  var available=STATE.allChallengeIds.filter(function(id){return id!==current&&STATE.challenges[id]&&STATE.challenges[id].points>0;});
  if(available.length===0){showToast('No other challenges!','#FF6B1A');return;}
  var newId=available[Math.floor(Math.random()*available.length)];
  patch(pageId,{Has_Rerolled:{checkbox:true},Reroll_Challenge_ID:{number:newId}}).then(function(){
    asg.hasRerolled=true;asg.rerollChallengeId=newId;
    render();showToast('Rerolled!','#BF00FF');
  });
};
window.rerollReveal=function(pageId){
  var asg=STATE.assignments.find(function(a){return a.pageId===pageId;});
  if(!asg||asg.hasRerolled)return;
  var current=getEffectiveChallengeId(asg);
  var available=STATE.allChallengeIds.filter(function(id){return id!==current&&STATE.challenges[id]&&STATE.challenges[id].points>0;});
  if(available.length===0){showToast('No other challenges!','#FF6B1A');return;}
  var newId=available[Math.floor(Math.random()*available.length)];
  patch(pageId,{Has_Rerolled:{checkbox:true},Reroll_Challenge_ID:{number:newId}}).then(function(){
    asg.hasRerolled=true;asg.rerollChallengeId=newId;
    showToast('Rerolled! Power lost!','#BF00FF');
    nextRevealStep();
  });
};
window.suggestChallenge=function(){

  var spiceEl=document.querySelector('input[name="spice"]:checked');
  if(!nameEl||!nameEl.value.trim()){showToast('Enter a name!','#FF6B1A');return;}
  if(!spiceEl){showToast('Pick spice level!','#FF6B1A');return;}
  var name=nameEl.value.trim();
  var spice=spiceEl.value;
  var pts=SPICE_PTS[spice]||1;
  var overlay=document.createElement('div');
  overlay.id='suggest-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;';
  var modal=document.createElement('div');
  modal.style.cssText='background:#0A0A18;border:1px solid rgba(0,255,136,0.3);border-radius:24px;padding:28px 24px;width:100%;max-width:380px;text-align:center;';
  modal.innerHTML='<div style="font-size:40px;margin-bottom:12px">\u{1F4A1}</div>'
    +'<div style="font-family:Bangers,cursive;font-size:24px;letter-spacing:2px;color:#00FF88;margin-bottom:8px">CONFIRM</div>'

    +'<div style="font-size:13px;color:#6B7280;margin-bottom:24px">'+spice+' - '+pts+'pt'+(pts>1?'s':'')+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    +'<button id="cancel-suggest" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;font-family:Bangers,cursive;font-size:18px;color:#6B7280;cursor:pointer">CANCEL</button>'
    +'<button id="send-suggest" style="background:linear-gradient(135deg,#00FF88,#00EEFF);border:none;border-radius:14px;padding:14px;font-family:Bangers,cursive;font-size:18px;color:#000;cursor:pointer">SEND!</button>'
    +'</div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  document.getElementById('cancel-suggest').onclick=function(){overlay.remove();};
  document.getElementById('send-suggest').onclick=function(){
    overlay.remove();
    var btn=document.getElementById('btn-suggest');if(btn){btn.disabled=true;btn.textContent='Sending...';}
    notionCreate(CONFIG.db_challenges,{Name:{title:[{text:{content:name}}]},Points:{number:pts},Status:{select:{name:'Pending'}}}).then(function(){
      showToast('Suggestion sent!','#00FF88');
      if(nameEl)nameEl.value='';if(spiceEl)spiceEl.checked=false;
      if(btn){btn.disabled=false;btn.textContent='SUGGEST CHALLENGE';}
    }).catch(function(e){showToast('Error: '+e.message,'#FF2D4B');if(btn){btn.disabled=false;btn.textContent='SUGGEST CHALLENGE';}});
  };
