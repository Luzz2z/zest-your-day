    .shield-player-name{font-family:'Bangers',cursive;font-size:44px;margin-bottom:8px;}

    @keyframes check-pop{0%{transform:scale(0.7)}100%{transform:scale(1)}}
    .btn-reroll{display:flex;align-items:center;gap:6px;background:rgba(191,0,255,0.08);border:1px solid rgba(191,0,255,0.35);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:900;color:#e879f9;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;}

    .effects-log-wrap{margin:0 16px 20px;}
    .effect-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px 16px;margin-bottom:8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;}
    .leaderboard{padding:0 16px;}
    .lb-card{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);}
    .lb-header-row{display:grid;grid-template-columns:40px 1fr 64px 64px 56px;gap:8px;padding:12px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.04);}

    .lb-row{display:grid;grid-template-columns:40px 1fr 64px 64px 56px;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.03);}

    .neon-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:13px;}

    .divider{height:1px;background:linear-gradient(to right,transparent,rgba(255,45,75,0.2),transparent);margin:28px 16px;}

<body>
<canvas id="particle-canvas"></canvas>
<div class="app">
  <div id="root"><div class="loading"><div class="spinner"></div><p>Loading...</p></div></div>
</div>
<div id="shield-container"></div>

<script>
(function(){
  var canvas=document.getElementById('particle-canvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var colors=['#FF2D4B','#FF6B1A','#FFD700','#00FF88','#00EEFF','#BF00FF'];
  var particles=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<50;i++){particles.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.5+0.3,color:colors[Math.floor(Math.random()*colors.length)],vx:(Math.random()-0.5)*0.3,vy:-Math.random()*0.4-0.1,alpha:Math.random()*0.5+0.1});}
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color+Math.floor(p.alpha*255).toString(16).padStart(2,'0');ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=canvas.height+5;p.x=Math.random()*canvas.width;}if(p.x<-5)p.x=canvas.width+5;if(p.x>canvas.width+5)p.x=-5;});requestAnimationFrame(draw);}
  draw();
})();

db_challenges:‘354403dde0e3804f8644d242a0ec6bf6’,

};

{name:‘Luzz’,emoji:’\u{1F525}’,color:’#FF2D4B’,colorDark:‘rgba(255,45,75,0.2)’},
{name:‘Y’,emoji:’\u26A1’,color:’#FFD700’,colorDark:‘rgba(255,215,0,0.2)’},
{name:‘Nicooo’,emoji:’\u{1F4B0}’,color:’#FF6B1A’,colorDark:‘rgba(255,107,26,0.2)’}
];
var POWERS={
‘\u{1F9B9} Entourloupeur’:{color:’#BF00FF’,bg:‘rgba(191,0,255,0.12)’,border:‘rgba(191,0,255,0.4)’,desc:‘Copy someone challenge. Complete it before them to steal their points!’,needsTarget:true,targetSelf:false,reactive:false},

function notionQuery(dbId,body){
body=body||{};
return fetch(’/api/notion/databases/’+dbId+’/query’,{method:‘POST’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(d){if(!d.results)throw new Error(d.message||‘Notion error’);return d.results;});
}
function notionPatch(pageId,properties){
return fetch(’/api/notion/pages/’+pageId,{method:‘PATCH’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({properties:properties})}).then(function(r){return r.json();}).then(function(d){if(d.object===‘error’)throw new Error(d.message||‘Update error’);return d;});
}
function notionCreate(dbId,properties){
return fetch(’/api/notion/pages’,{method:‘POST’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({parent:{database_id:dbId},properties:properties})}).then(function(r){return r.json();});
}
function getProp(page,name,type){
var p=page.properties[name];
if(!p)return null;
if(type===‘number’)return p.number!=null?p.number:0;
if(type===‘title’)return p.title&&p.title[0]?p.title[0].plain_text:’’;
if(type===‘checkbox’)return p.checkbox===true;
if(type===‘formula_number’)return p.formula?p.formula.number||0:0;
if(type===‘formula_string’)return p.formula?p.formula.string||’’:’’;
if(type===‘select’)return p.select?p.select.name||’’:’’;
if(type===‘text’)return p.rich_text&&p.rich_text[0]?p.rich_text[0].plain_text:’’;
return null;
}

function getBaseChallenge(asg){return(asg.rerollChallengeId&&asg.rerollChallengeId>0)?asg.rerollChallengeId:asg.challengeId;}

function getEffectiveChallengeId(asg){
var playerName=PLAYERS[asg.playerIndex]?PLAYERS[asg.playerIndex].name:null;
var swapper=STATE.assignments.find(function(a){return a.powerUsed&&a.powerType===’\u{1F504} Swap’&&a.powerTarget===playerName&&a.playerIndex!==asg.playerIndex;});
if(swapper)return getBaseChallenge(swapper);
if(asg.powerUsed&&asg.powerType===’\u{1F504} Swap’&&asg.powerTarget){
var target=STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===asg.powerTarget;});
if(target)return getBaseChallenge(target);
}
if(asg.powerUsed&&asg.powerType===’\u{1F9B9} Entourloupeur’&&asg.powerTarget){
var target2=STATE.assignments.find(function(a){return PLAYERS[a.playerIndex]&&PLAYERS[a.playerIndex].name===asg.powerTarget;});
if(target2)return getBaseChallenge(target2);
}
var copier=STATE.assignments.find(function(a){return a.powerUsed&&a.powerType===’\u{1F46F} Copier-Coller’&&a.powerTarget===playerName&&a.playerIndex!==asg.playerIndex;});
if(copier)return getBaseChallenge(copier);
return getBaseChallenge(asg);
}

function getEffectivePts(asg){
var effectiveId=getEffectiveChallengeId(asg);
var challenge=STATE.challenges[effectiveId];
var pts=challenge?challenge.points:0;
if(asg.effectUpgrade&&challenge){
var spice=challenge.spice||’’;
var idx=-1;
for(var i=0;i<SPICE_ORDER.length;i++){if(spice.indexOf(SPICE_ORDER[i].split(’ ’)[1]||SPICE_ORDER[i])>=0){idx=i;break;}}
if(idx<0){for(var j=0;j<SPICE_ORDER.length;j++){if(spice===SPICE_ORDER[j]){idx=j;break;}}}
if(idx>=0){
var newIdx=asg.effectUpgrade===‘upgrade’?Math.min(idx+1,3):Math.max(idx-1,0);
pts=SPICE_PTS[SPICE_ORDER[newIdx]]||pts;
}
}
if(asg.effectBridage)pts=Math.ceil(pts*0.5);
return pts;
}
