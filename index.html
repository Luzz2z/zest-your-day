<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌶️ Zest Your Day</title>
  <link rel="icon" type="image/png" href="LOGOZEST.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E63946; --orange: #F4A261; --yellow: #FFD166;
      --green: #2DC653; --darker: #0F0F1A; --card: #16213E;
      --text: #F5F5F5; --muted: #8892A4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--darker); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 20%, rgba(230,57,70,0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(244,162,97,0.1) 0%, transparent 50%); pointer-events: none; z-index: 0; }
    .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 100px; }

    /* BANNER */
    .banner {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 21/9;
      object-fit: cover;
      display: block;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .header { padding: 20px 20px 16px; text-align: center; }
    .header-mascot { font-size: 64px; display: block; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .header h1 { font-family: 'Bangers', cursive; font-size: 48px; letter-spacing: 3px; background: linear-gradient(135deg, var(--red), var(--orange), var(--yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; margin-bottom: 4px; }
    .header-sub { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
    .day-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,209,102,0.15); border: 1px solid rgba(255,209,102,0.3); border-radius: 20px; padding: 6px 16px; font-size: 14px; font-weight: 700; color: var(--yellow); margin-top: 12px; }
    .next-day-wrap { padding: 0 20px 24px; }
    .btn-next { width: 100%; background: linear-gradient(135deg, var(--red), var(--orange)); border: none; border-radius: 16px; padding: 18px; font-family: 'Bangers', cursive; font-size: 24px; letter-spacing: 2px; color: white; cursor: pointer; box-shadow: 0 8px 32px rgba(230,57,70,0.4); transition: transform 0.15s; }
    .btn-next:active { transform: scale(0.97); }
    .btn-next:disabled { opacity: 0.6; cursor: not-allowed; }
    .section-title { font-family: 'Bangers', cursive; font-size: 22px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; padding: 0 20px 12px; }
    .cards { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.06); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--player-color); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .player-info { display: flex; align-items: center; gap: 10px; }
    .player-emoji { font-size: 28px; }
    .player-name { font-weight: 900; font-size: 18px; }
    .player-streak { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--orange); background: rgba(244,162,97,0.15); border-radius: 10px; padding: 4px 10px; }
    .streak-bonus { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--yellow); background: rgba(255,209,102,0.15); border: 1px solid rgba(255,209,102,0.3); border-radius: 8px; padding: 2px 8px; margin-left: 6px; }
    .challenge-box { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .challenge-id { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .challenge-name { font-weight: 700; font-size: 16px; line-height: 1.4; margin-bottom: 8px; }
    .challenge-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spice-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 8px; background: rgba(255,255,255,0.08); }
    .total-pts-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 8px; background: rgba(255,209,102,0.15); color: var(--yellow); }
    .rerolled-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: rgba(138,43,226,0.2); color: #c084fc; border: 1px solid rgba(138,43,226,0.3); }
    .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .validate-label { font-size: 14px; color: var(--muted); font-weight: 600; }
    .checkbox-wrap input[type="checkbox"] { display: none; }
    .checkbox-custom { width: 32px; height: 32px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 16px; }
    .checkbox-wrap input:checked + .checkbox-custom { background: var(--green); border-color: var(--green); box-shadow: 0 0 16px rgba(45,198,83,0.4); }
    .btn-reroll { display: flex; align-items: center; gap: 6px; background: rgba(138,43,226,0.2); border: 1px solid rgba(138,43,226,0.4); border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 700; color: #c084fc; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-reroll:hover { background: rgba(138,43,226,0.35); }
    .btn-reroll:disabled { opacity: 0.4; cursor: not-allowed; }
    .card.validated { border-color: rgba(45,198,83,0.3); }
    .card.validated::after { content: ''; position: absolute; inset: 0; background: rgba(45,198,83,0.04); pointer-events: none; }
    .leaderboard { padding: 0 20px; }
    .lb-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
    .lb-header-row { display: grid; grid-template-columns: 36px 1fr 60px 60px 60px; gap: 8px; padding: 10px 16px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .lb-header-row span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; text-align: center; font-weight: 700; }
    .lb-header-row span:nth-child(2) { text-align: left; }
    .lb-row { display: grid; grid-template-columns: 36px 1fr 60px 60px 60px; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:first-child { background: rgba(255,209,102,0.08); }
    .lb-rank { font-family: 'Bangers', cursive; font-size: 20px; text-align: center; }
    .lb-player { display: flex; align-items: center; gap: 8px; }
    .lb-emoji { font-size: 20px; }
    .lb-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-stat { text-align: center; }
    .lb-stat-val { font-weight: 900; font-size: 16px; }
    .lb-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .suggest { padding: 0 20px; }
    .suggest-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
    .suggest-header { padding: 16px 20px; background: rgba(45,198,83,0.08); border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .suggest-header h3 { font-family: 'Bangers', cursive; font-size: 20px; letter-spacing: 2px; color: var(--green); }
    .suggest-toggle { font-size: 18px; transition: transform 0.3s; }
    .suggest-toggle.open { transform: rotate(180deg); }
    .suggest-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s; }
    .suggest-body.open { max-height: 600px; padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
    .form-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--green); }
    .spice-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .spice-option { display: none; }
    .spice-option + label { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: rgba(255,255,255,0.04); border: 2px solid transparent; border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 700; text-align: center; transition: all 0.2s; }
    .spice-option:checked + label { border-color: var(--green); background: rgba(45,198,83,0.1); }
    .spice-emoji { font-size: 22px; }
    .btn-suggest { width: 100%; background: linear-gradient(135deg, var(--green), #1db954); border: none; border-radius: 12px; padding: 14px; font-family: 'Bangers', cursive; font-size: 20px; letter-spacing: 2px; color: white; cursor: pointer; transition: transform 0.15s; }
    .btn-suggest:active { transform: scale(0.97); }
    .btn-suggest:disabled { opacity: 0.6; cursor: not-allowed; }
    .rules { padding: 0 20px; }
    .rules-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
    .rules-header { padding: 16px 20px; background: rgba(230,57,70,0.1); border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .rules-header h3 { font-family: 'Bangers', cursive; font-size: 20px; letter-spacing: 2px; color: var(--red); }
    .rules-toggle { font-size: 18px; transition: transform 0.3s; }
    .rules-toggle.open { transform: rotate(180deg); }
    .rules-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s; }
    .rules-body.open { max-height: 1400px; padding: 20px; }
    .rule-item { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .rule-item:last-child { border-bottom: none; }
    .rule-icon { font-size: 24px; flex-shrink: 0; margin-top: 2px; }
    .rule-title { font-weight: 900; font-size: 15px; margin-bottom: 4px; }
    .rule-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .streak-table { margin-top: 10px; background: rgba(255,255,255,0.04); border-radius: 10px; overflow: hidden; }
    .streak-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
    .streak-row:last-child { border-bottom: none; }
    .streak-row span:first-child { color: var(--orange); font-weight: 700; }
    .streak-row span:last-child { color: var(--yellow); font-weight: 900; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
    .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-weight: 600; }
    .error-box { margin: 20px; padding: 20px; background: rgba(230,57,70,0.1); border: 1px solid rgba(230,57,70,0.3); border-radius: 16px; color: var(--red); font-weight: 600; font-size: 14px; line-height: 1.6; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); color: white; font-weight: 700; padding: 12px 24px; border-radius: 50px; font-size: 14px; z-index: 999; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 24px 20px; }
  </style>
</head>
<body>
<div class="app">
  <img class="banner" src="Gemini_Generated_Image_4m0fhc4m0fhc4m0f.png" alt="Zest Your Day Banner" />
  <div id="root"><div class="loading"><div class="spinner"></div><p>Loading challenges...</p></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
  const CONFIG = {
    db_system:      '354403dde0e380aa85bfe7d9fd139be5',
    db_challenges:  '354403dde0e3804f8644d242a0ec6bf6',
    db_assignments: '354403dde0e380f797ccfb85ad5a072e',
  };
  const PLAYERS = [
    { name: 'Banuu',                emoji: '🌵', color: '#2DC653' },
    { name: 'Luzz',                 emoji: '🔥', color: '#E63946' },
    { name: 'Y',                    emoji: '⚡', color: '#FFD166' },
    { name: 'Nico multimilionario', emoji: '💰', color: '#F4A261' },
  ];
  const SPICE_POINTS = { '🌱 Mild': 1, '🌶️ Spicy': 2, '🔥 Hot': 3, '⚡ Atomic': 5 };
  function streakBonus(s) { return s >= 10 ? 3 : s >= 5 ? 2 : s >= 3 ? 1 : 0; }
  function spiceColor(pts) { return pts >= 5 ? '#E63946' : pts >= 3 ? '#F4A261' : pts >= 2 ? '#FFD166' : '#2DC653'; }

  async function notionQuery(dbId, body = {}) {
    const res = await fetch('/api/notion?endpoint=databases/' + dbId + '/query', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Notion error');
    return data.results;
  }
  async function notionPatch(pageId, properties) {
    const res = await fetch('/api/notion?endpoint=pages/' + pageId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ properties }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Update error');
    return data;
  }
  async function notionCreate(dbId, properties) {
    const res = await fetch('/api/notion?endpoint=pages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parent: { database_id: dbId }, properties }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Create error');
    return data;
  }
  function getProp(page, name, type) {
    const p = page.properties[name];
    if (!p) return null;
    if (type === 'number') return p.number ?? 0;
    if (type === 'title') return p.title?.[0]?.plain_text ?? '';
    if (type === 'checkbox') return p.checkbox ?? false;
    if (type === 'formula_number') return p.formula?.number ?? 0;
    if (type === 'formula_string') return p.formula?.string ?? '';
    if (type === 'select') return p.select?.name ?? '';
    return null;
  }
  function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = color || '#2DC653';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  let STATE = { dayCounter: 1, systemPageId: null, challenges: {}, assignments: [], allChallengeIds: [] };

  async function loadData() {
    const sysPages = await notionQuery(CONFIG.db_system);
    const sys = sysPages[0];
    STATE.systemPageId = sys.id;
    STATE.dayCounter = getProp(sys, 'Day_Counter', 'number');
    const chPages = await notionQuery(CONFIG.db_challenges);
    STATE.challenges = {};
    STATE.allChallengeIds = [];
    for (const p of chPages) {
      const id = getProp(p, 'ID_Global', 'number');
      const status = getProp(p, 'Status', 'select');
      if (status === '✅ Active' || !status) {
        STATE.challenges[id] = { id, name: getProp(p, 'Name', 'title'), points: getProp(p, 'Points', 'number'), spice: getProp(p, 'Spice_Level', 'formula_string') || getProp(p, 'Spice_Level', 'select') };
        STATE.allChallengeIds.push(id);
      }
    }
    const asgPages = await notionQuery(CONFIG.db_assignments);
    STATE.assignments = asgPages.map(p => ({
      pageId: p.id, name: getProp(p, 'Name', 'title'), playerIndex: getProp(p, 'Player_Index', 'number'),
      winStreak: getProp(p, 'Win_Streak', 'number'), totalScore: getProp(p, 'Total_Score', 'number'),
      defisReussis: getProp(p, 'Defis_Reussis', 'number'), isValidated: getProp(p, 'Is_Validated', 'checkbox'),
      challengeId: getProp(p, 'Challenge_ID_Today', 'formula_number'),
      hasRerolled: getProp(p, 'Has_Rerolled', 'checkbox'),
      rerollChallengeId: getProp(p, 'Reroll_Challenge_ID', 'number'),
    })).sort((a, b) => a.playerIndex - b.playerIndex);
  }

  function getEffectiveChallengeId(asg) {
    return (asg.rerollChallengeId && asg.rerollChallengeId > 0) ? asg.rerollChallengeId : asg.challengeId;
  }

  async function toggleValidation(pageId, current) {
    const newVal = !current;
    await notionPatch(pageId, { Is_Validated: { checkbox: newVal } });
    const asg = STATE.assignments.find(a => a.pageId === pageId);
    if (asg) asg.isValidated = newVal;
    render();
    showToast(newVal ? '✅ Challenge validated!' : '❌ Validation removed');
  }

  async function reroll(pageId) {
    const asg = STATE.assignments.find(a => a.pageId === pageId);
    if (!asg || asg.hasRerolled) return;
    const current = getEffectiveChallengeId(asg);
    const available = STATE.allChallengeIds.filter(id => id !== current);
    if (available.length === 0) { showToast('No other challenges available!', '#F4A261'); return; }
    const newId = available[Math.floor(Math.random() * available.length)];
    await notionPatch(pageId, {
      Has_Rerolled: { checkbox: true },
      Reroll_Challenge_ID: { number: newId },
    });
    asg.hasRerolled = true;
    asg.rerollChallengeId = newId;
    render();
    showToast('🎲 New challenge! Streak kept 🔥', '#c084fc');
  }

  async function nextDay() {
    const btn = document.getElementById('btn-next');
    btn.disabled = true; btn.textContent = '⏳ Updating...';
    try {
      for (const asg of STATE.assignments) {
        const effectiveId = getEffectiveChallengeId(asg);
        const challenge = STATE.challenges[effectiveId];
        const pts = challenge?.points ?? 0;
        const bonus = asg.isValidated ? streakBonus(asg.winStreak) : 0;
        await notionPatch(asg.pageId, {
          Total_Score:         { number: asg.isValidated ? asg.totalScore + pts + bonus : asg.totalScore },
          Win_Streak:          { number: asg.isValidated ? asg.winStreak + 1 : 0 },
          Defis_Reussis:       { number: asg.isValidated ? asg.defisReussis + 1 : asg.defisReussis },
          Is_Validated:        { checkbox: false },
          Has_Rerolled:        { checkbox: false },
          Reroll_Challenge_ID: { number: 0 },
        });
      }
      await notionPatch(STATE.systemPageId, { Day_Counter: { number: STATE.dayCounter + 1 } });
      showToast('🌶️ New day! New challenges!');
      await loadData(); render();
    } catch(e) { showToast('❌ Error: ' + e.message, '#E63946'); btn.disabled = false; }
  }

  async function suggestChallenge() {
    const nameEl = document.getElementById('suggest-name');
    const spiceEl = document.querySelector('input[name="spice"]:checked');
    if (!nameEl.value.trim()) { showToast('⚠️ Enter a challenge name!', '#F4A261'); return; }
    if (!spiceEl) { showToast('⚠️ Pick a spice level!', '#F4A261'); return; }
    const btn = document.getElementById('btn-suggest');
    btn.disabled = true; btn.textContent = 'Sending...';
    const pts = SPICE_POINTS[spiceEl.value] || 1;
    try {
      await notionCreate(CONFIG.db_challenges, {
        Name:   { title: [{ text: { content: nameEl.value.trim() } }] },
        Points: { number: pts },
        Status: { select: { name: '⏳ Pending' } },
      });
      showToast('💡 Suggestion sent! Awaiting approval.');
      nameEl.value = '';
      if (spiceEl) spiceEl.checked = false;
    } catch(e) { showToast('❌ Error: ' + e.message, '#E63946'); }
    btn.disabled = false; btn.textContent = '💡 SUGGEST CHALLENGE';
  }

  function toggleSection(bodyId, toggleId) {
    document.getElementById(bodyId).classList.toggle('open');
    document.getElementById(toggleId).classList.toggle('open');
  }

  function render() {
    const root = document.getElementById('root');
    const lb = [...STATE.assignments].sort((a, b) => b.totalScore - a.totalScore);
    const rankEmoji = ['🥇','🥈','🥉','4️⃣'];
    root.innerHTML = `
      <div class="header">
        <span class="header-mascot">🌶️</span>
        <h1>ZEST YOUR DAY</h1>
        <div class="header-sub">Mexico Edition</div>
        <div class="day-badge">📅 Day ${STATE.dayCounter}</div>
      </div>
      <div class="next-day-wrap">
        <button class="btn-next" id="btn-next" onclick="nextDay()">⏭️ NEXT DAY</button>
      </div>
      <div class="section-title">🎯 Today's Challenges</div>
      <div class="cards">
        ${STATE.assignments.map(asg => {
          const player = PLAYERS[asg.playerIndex] || { name: asg.name, emoji: '🎮', color: '#8892A4' };
          const effectiveId = getEffectiveChallengeId(asg);
          const challenge = STATE.challenges[effectiveId];
          const pts = challenge?.points ?? 0;
          const bonus = streakBonus(asg.winStreak);
          const isRerolled = asg.rerollChallengeId > 0;
          return `
          <div class="card ${asg.isValidated ? 'validated' : ''}" style="--player-color: ${player.color}">
            <div class="card-header">
              <div class="player-info">
                <span class="player-emoji">${player.emoji}</span>
                <span class="player-name">${player.name}</span>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <div class="player-streak">🔥 ${asg.winStreak}</div>
                ${bonus > 0 ? `<span class="streak-bonus">⚡ +${bonus}</span>` : ''}
              </div>
            </div>
            <div class="challenge-box">
              <div class="challenge-id">
                Challenge #${effectiveId}
                ${isRerolled ? '<span class="rerolled-badge">🎲 Rerolled</span>' : ''}
              </div>
              <div class="challenge-name">${challenge?.name ?? '⏳ Loading...'}</div>
              <div class="challenge-meta">
                <span class="spice-badge" style="color:${spiceColor(pts)}">${challenge?.spice ?? ''} · ${pts} pt${pts > 1 ? 's' : ''}</span>
                ${bonus > 0 ? `<span class="total-pts-badge">⚡ Total: ${pts + bonus} pts</span>` : ''}
              </div>
            </div>
            <div class="card-actions">
              <div style="display:flex;align-items:center;gap:10px">
                <span class="validate-label">Done?</span>
                <label class="checkbox-wrap">
                  <input type="checkbox" ${asg.isValidated ? 'checked' : ''} onchange="toggleValidation('${asg.pageId}', ${asg.isValidated})" />
                  <div class="checkbox-custom">${asg.isValidated ? '✓' : ''}</div>
                </label>
              </div>
              <button class="btn-reroll" onclick="reroll('${asg.pageId}')" ${asg.hasRerolled ? 'disabled' : ''}>
                🎲 ${asg.hasRerolled ? 'Rerolled' : 'Reroll'}
              </button>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="divider"></div>
      <div class="section-title">🏆 Leaderboard</div>
      <div class="leaderboard">
        <div class="lb-card">
          <div class="lb-header-row"><span>#</span><span>Player</span><span>Score</span><span>Streak</span><span>✅</span></div>
          ${lb.map((asg, i) => {
            const player = PLAYERS[asg.playerIndex] || { name: asg.name, emoji: '🎮' };
            return `<div class="lb-row">
              <div class="lb-rank">${rankEmoji[i] ?? i+1}</div>
              <div class="lb-player"><span class="lb-emoji">${player.emoji}</span><span class="lb-name">${player.name}</span></div>
              <div class="lb-stat"><div class="lb-stat-val" style="color:var(--yellow)">${asg.totalScore}</div><div class="lb-stat-label">pts</div></div>
              <div class="lb-stat"><div class="lb-stat-val" style="color:var(--orange)">${asg.winStreak}🔥</div><div class="lb-stat-label">streak</div></div>
              <div class="lb-stat"><div class="lb-stat-val" style="color:var(--green)">${asg.defisReussis}</div><div class="lb-stat-label">done</div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="divider"></div>
      <div class="section-title">💡 Suggest a Challenge</div>
      <div class="suggest">
        <div class="suggest-card">
          <div class="suggest-header" onclick="toggleSection('suggest-body','suggest-toggle')">
            <h3>➕ NEW CHALLENGE IDEA</h3>
            <span class="suggest-toggle" id="suggest-toggle">▼</span>
          </div>
          <div class="suggest-body" id="suggest-body">
            <div class="form-group">
              <label class="form-label">Challenge name</label>
              <input class="form-input" id="suggest-name" type="text" placeholder="e.g. Sing your order at a restaurant..." maxlength="100" />
            </div>
            <div class="form-group">
              <label class="form-label">Spice level</label>
              <div class="spice-selector">
                <input type="radio" name="spice" id="s1" value="🌱 Mild" class="spice-option">
                <label for="s1"><span class="spice-emoji">🌱</span>Mild<br><small>1 pt</small></label>
                <input type="radio" name="spice" id="s2" value="🌶️ Spicy" class="spice-option">
                <label for="s2"><span class="spice-emoji">🌶️</span>Spicy<br><small>2 pts</small></label>
                <input type="radio" name="spice" id="s3" value="🔥 Hot" class="spice-option">
                <label for="s3"><span class="spice-emoji">🔥</span>Hot<br><small>3 pts</small></label>
                <input type="radio" name="spice" id="s4" value="⚡ Atomic" class="spice-option">
                <label for="s4"><span class="spice-emoji">⚡</span>Atomic<br><small>5 pts</small></label>
              </div>
            </div>
            <button class="btn-suggest" id="btn-suggest" onclick="suggestChallenge()">💡 SUGGEST CHALLENGE</button>
            <p style="font-size:12px;color:var(--muted);margin-top:12px;text-align:center">Your suggestion will be reviewed before appearing in the game ✅</p>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="section-title">📖 Rules</div>
      <div class="rules">
        <div class="rules-card">
          <div class="rules-header" onclick="toggleSection('rules-body','rules-toggle')">
            <h3>📜 HOW IT WORKS</h3>
            <span class="rules-toggle" id="rules-toggle">▼</span>
          </div>
          <div class="rules-body" id="rules-body">
            <div class="rule-item">
              <div class="rule-icon">🎯</div>
              <div class="rule-content">
                <div class="rule-title">One challenge per day</div>
                <div class="rule-desc">Each player gets a unique challenge every day. Challenges rotate automatically — no two players get the same one!</div>
              </div>
            </div>
            <div class="rule-item">
              <div class="rule-icon">🌶️</div>
              <div class="rule-content">
                <div class="rule-title">Spice levels</div>
                <div class="rule-desc">Each challenge has a difficulty level that determines how many points you earn.</div>
                <div class="streak-table">
                  <div class="streak-row"><span>🌱 Mild</span><span>1 pt</span></div>
                  <div class="streak-row"><span>🌶️ Spicy</span><span>2 pts</span></div>
                  <div class="streak-row"><span>🔥 Hot</span><span>3 pts</span></div>
                  <div class="streak-row"><span>⚡ Atomic</span><span>5 pts</span></div>
                </div>
              </div>
            </div>
            <div class="rule-item">
              <div class="rule-icon">🔥</div>
              <div class="rule-content">
                <div class="rule-title">Streak bonuses</div>
                <div class="rule-desc">Complete challenges on consecutive days to unlock bonus points! Your streak resets to 0 if you miss a day.</div>
                <div class="streak-table">
                  <div class="streak-row"><span>🔥 3 days in a row</span><span>+1 pt bonus</span></div>
                  <div class="streak-row"><span>🔥 5 days in a row</span><span>+2 pts bonus</span></div>
                  <div class="streak-row"><span>🔥 10 days in a row</span><span>+3 pts bonus</span></div>
                </div>
              </div>
            </div>
            <div class="rule-item">
              <div class="rule-icon">🎲</div>
              <div class="rule-content">
                <div class="rule-title">Reroll (once per day)</div>
                <div class="rule-desc">Not feeling your challenge? Hit Reroll to get a random new one — no streak penalty! You only get one reroll per day, so use it wisely.</div>
              </div>
            </div>
            <div class="rule-item">
              <div class="rule-icon">✅</div>
              <div class="rule-content">
                <div class="rule-title">Challenge validation</div>
                <div class="rule-desc">The game master checks the box for each player who completed their challenge. Be honest — shame is the real punishment 😈</div>
              </div>
            </div>
            <div class="rule-item">
              <div class="rule-icon">⏭️</div>
              <div class="rule-content">
                <div class="rule-title">Next Day button</div>
                <div class="rule-desc">At the end of the day, the game master presses Next Day. Scores update, streaks are calculated, and new challenges are assigned for tomorrow.</div>
              </div>
            </div>
            <div class="rule-item">
              <div class="rule-icon">💡</div>
              <div class="rule-content">
                <div class="rule-title">Suggest a challenge</div>
                <div class="rule-desc">Got a wild idea? Submit it using the form above. The game master reviews it before it enters the rotation.</div>
              </div>
            </div>
            <div class="rule-item">
              <div class="rule-icon">🏆</div>
              <div class="rule-content">
                <div class="rule-title">Leaderboard</div>
                <div class="rule-desc">Rankings update in real time. The player with the most points at the end wins eternal glory 🌶️</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function init() {
    try { await loadData(); render(); }
    catch(e) { document.getElementById('root').innerHTML = '<div class="error-box">❌ Connection error.<br><br>Make sure NOTION_TOKEN is set in your Vercel environment variables.<br><br>Details: ' + e.message + '</div>'; }
  }
  init();
</script>
</body>
</html>
