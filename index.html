<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#050508;color:#F5F5F5;font-family:sans-serif;padding:0 0 80px;}
.card{background:#0A0A18;border-radius:20px;border:1px solid rgba(255,255,255,0.06);overflow:hidden;margin:0 16px 14px;}
.card.validated{border-color:rgba(0,255,136,0.3);}
.card-band{height:3px;}
.card-cover{height:64px;display:flex;align-items:center;padding:0 18px;gap:12px;}
.player-name{font-size:22px;font-weight:900;}
.card-body{padding:12px 18px 16px;}
.challenge-box{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.05);border-radius:14px;padding:14px;margin-bottom:12px;}
.challenge-name{font-weight:900;font-size:16px;margin-bottom:6px;}
.spice{font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,0.06);display:inline-block;}
.card-actions{display:flex;align-items:center;justify-content:space-between;}
.done-label{font-size:11px;color:#6B7280;font-weight:700;text-transform:uppercase;}
.check-box{width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,0.12);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
.check-box.checked{background:#00FF88;border-color:#00FF88;box-shadow:0 0 20px rgba(0,255,136,0.5);}
.btn-reroll{background:rgba(191,0,255,0.08);border:1px solid rgba(191,0,255,0.35);border-radius:10px;padding:9px 14px;font-size:12px;font-weight:900;color:#e879f9;cursor:pointer;font-family:sans-serif;}
.btn-reroll:disabled{opacity:0.3;cursor:not-allowed;}
.section-title{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:2px;padding:0 20px 12px;color:#6B7280;}
.divider{height:1px;background:linear-gradient(to right,transparent,rgba(255,45,75,0.2),transparent);margin:24px 16px;}
.lb-wrap{padding:0 16px;}
.lb-card{background:#0A0A18;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);}
.lb-row{display:grid;grid-template-columns:40px 1fr 60px 60px 52px;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.03);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{font-size:20px;text-align:center;}
.lb-name{font-weight:900;font-size:14px;}
.lb-stat{text-align:center;}
.lb-val{font-weight:900;font-size:15px;}
.lb-lbl{font-size:9px;color:#6B7280;text-transform:uppercase;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);color:white;font-weight:900;padding:12px 24px;border-radius:40px;font-size:14px;z-index:999;transition:transform 0.3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="root">Loading...</div>
<div class="toast" id="toast"></div>
<script>
var PLAYERS=[
  {name:'Banuu',emoji:'🌵',color:'#00FF88'},
  {name:'Luzz',emoji:'🔥',color:'#FF2D4B'},
  {name:'Y',emoji:'⚡',color:'#FFD700'},
  {name:'Nicooo',emoji:'💰',color:'#FF6B1A'}
];
var S={day:1,challenges:{},players:[],ids:[]};

function toast(msg,col){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.background=col||'#00FF88';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}
function query(dbId){
  return fetch('/api/notion/databases/'+dbId+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json();}).then(function(d){return d.results;});
}
function patch(pageId,props){
  return fetch('/api/notion/pages/'+pageId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({properties:props})}).then(function(r){return r.json();});
}
function gp(page,name,type){
  var p=page.properties[name];if(!p)return null;
  if(type==='num')return p.number!=null?p.number:0;
  if(type==='title')return p.title&&p.title[0]?p.title[0].plain_text:'';
  if(type==='check')return p.checkbox===true;
  if(type==='fnum')return p.formula?p.formula.number||0:0;
  if(type==='fstr')return p.formula?p.formula.string||'':'';
  if(type==='sel')return p.select?p.select.name||'':'';
  return null;
}

window.validate=function(pageId,cur){
  var nv=!cur;
  patch(pageId,{Is_Validated:{checkbox:nv}}).then(function(){
    var a=S.players.find(function(x){return x.pageId===pageId;});
    if(a)a.isValidated=nv;
    render();
    toast(nv?'Challenge done!':'Removed',nv?'#00FF88':'#FF2D4B');
  });
};
window.reroll=function(pageId){
  var a=S.players.find(function(x){return x.pageId===pageId;});
  if(!a||a.hasRerolled)return;
  var cur=a.rerollId>0?a.rerollId:a.challengeId;
  var avail=S.ids.filter(function(id){return id!==cur;});
  if(!avail.length){toast('No other challenges!','#FF6B1A');return;}
  var newId=avail[Math.floor(Math.random()*avail.length)];
  patch(pageId,{Has_Rerolled:{checkbox:true},Reroll_Challenge_ID:{number:newId}}).then(function(){
    a.hasRerolled=true;a.rerollId=newId;
    render();toast('Rerolled!','#BF00FF');
  });
};

function render(){
  var lb=S.players.slice().sort(function(a,b){return b.totalScore-a.totalScore;});
  var medals=['🥇','🥈','🥉','4'];

  var html='<div style="padding:32px 20px 16px;text-align:center"><div style="font-size:56px">🌶️</div><div style="font-size:36px;font-weight:900;background:linear-gradient(135deg,#FF2D4B,#FF6B1A,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent">ZEST YOUR DAY</div><div style="font-size:11px;color:#00EEFF;text-transform:uppercase;letter-spacing:4px">Mexico Edition</div><div style="display:inline-flex;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.35);border-radius:20px;padding:6px 18px;font-size:14px;font-weight:900;color:#FFD700;margin-top:12px">Day '+S.day+'</div></div>';

  html+='<div class="section-title">Challenges</div>';
  S.players.forEach(function(a){
    var pl=PLAYERS[a.playerIndex]||{name:'?',emoji:'?',color:'#fff'};
    var cid=a.rerollId>0?a.rerollId:a.challengeId;
    var ch=S.challenges[cid]||{name:'?',pts:0,spice:''};
    html+='<div class="card'+(a.isValidated?' validated':'')+'">'
      +'<div class="card-band" style="background:'+pl.color+'"></div>'
      +'<div class="card-cover"><span style="font-size:32px">'+pl.emoji+'</span><span class="player-name" style="color:'+pl.color+'">'+pl.name+'</span></div>'
      +'<div class="card-body">'
      +'<div class="challenge-box">'
      +'<div class="challenge-name">'+ch.name+'</div>'
      +'<span class="spice">'+ch.spice+' - '+ch.pts+'pts</span>'
      +'</div>'
      +'<div class="card-actions">'
      +'<div style="display:flex;align-items:center;gap:8px"><span class="done-label">Done?</span>'
      +'<div class="check-box'+(a.isValidated?' checked':'')+'" onclick="validate(\''+a.pageId+'\','+a.isValidated+')">'+(a.isValidated?'✓':'')+'</div></div>'
      +'<button class="btn-reroll" onclick="reroll(\''+a.pageId+'\')"'+(a.hasRerolled?' disabled':'')+'>🎲 '+(a.hasRerolled?'Rerolled':'Reroll')+'</button>'
      +'</div></div></div>';
  });

  html+='<div class="divider"></div><div class="section-title">Leaderboard</div>';
  html+='<div class="lb-wrap"><div class="lb-card">';
  lb.forEach(function(a,i){
    var pl=PLAYERS[a.playerIndex]||{name:'?',emoji:'?',color:'#fff'};
    html+='<div class="lb-row">'
      +'<div class="lb-rank">'+(medals[i]||i+1)+'</div>'
      +'<div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">'+pl.emoji+'</span><span class="lb-name" style="color:'+pl.color+'">'+pl.name+'</span></div>'
      +'<div class="lb-stat"><div class="lb-val" style="color:#FFD700">'+a.totalScore+'</div><div class="lb-lbl">pts</div></div>'
      +'<div class="lb-stat"><div class="lb-val" style="color:#FF6B1A">'+a.winStreak+'</div><div class="lb-lbl">streak</div></div>'
      +'<div class="lb-stat"><div class="lb-val" style="color:#00FF88">'+a.defisReussis+'</div><div class="lb-lbl">done</div></div>'
      +'</div>';
  });
  html+='</div></div>';

  document.getElementById('root').innerHTML=html;
}

var DB={
  system:'354403dde0e380aa85bfe7d9fd139be5',
  challenges:'354403dde0e3804f8644d242a0ec6bf6',
  assignments:'354403dde0e380f797ccfb85ad5a072e'
};

query(DB.system).then(function(sys){
  S.day=gp(sys[0],'Day_Counter','num')||1;
  return query(DB.challenges);
}).then(function(chs){
  chs.forEach(function(p){
    var id=gp(p,'ID_Global','num');
    var st=gp(p,'Status','sel');
    if(st==='✅ Active'||!st){
      S.challenges[id]={name:gp(p,'Name','title'),pts:gp(p,'Points','num')||0,spice:gp(p,'Spice_Level','fstr')||''};
      S.ids.push(id);
    }
  });
  return query(DB.assignments);
}).then(function(asgs){
  S.players=asgs.map(function(p){
    return{
      pageId:p.id,playerIndex:gp(p,'Player_Index','num')||0,
      winStreak:gp(p,'Win_Streak','num')||0,totalScore:gp(p,'Total_Score','num')||0,
      defisReussis:gp(p,'Defis_Reussis','num')||0,
      isValidated:gp(p,'Is_Validated','check'),
      challengeId:gp(p,'Challenge_ID_Today','fnum')||0,
      hasRerolled:gp(p,'Has_Rerolled','check'),
      rerollId:gp(p,'Reroll_Challenge_ID','num')||0
    };
  }).sort(function(a,b){return a.playerIndex-b.playerIndex;});
  render();
}).catch(function(e){
  document.getElementById('root').textContent='ERROR: '+e.message;
});
</script>
</body>
</html>
