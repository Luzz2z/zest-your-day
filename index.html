<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#050508;color:#F5F5F5;font-family:sans-serif;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;}
.spinner{width:48px;height:48px;border:2px solid rgba(255,45,75,0.15);border-top-color:#FF2D4B;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#6B7280;font-weight:700;text-transform:uppercase;letter-spacing:3px;font-size:11px;}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div><p>Loading...</p></div></div>
<script>
fetch('/api/notion/databases/354403dde0e380aa85bfe7d9fd139be5/query',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:'{}'
}).then(function(r){return r.json();})
.then(function(d){
  document.getElementById('root').textContent='OK: '+d.results.length+' results';
}).catch(function(e){
  document.getElementById('root').textContent='ERROR: '+e.message;
});
</script>
</body>
</html>
