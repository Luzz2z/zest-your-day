<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#FF2D4B;--orange:#FF6B1A;--yellow:#FFD700;--green:#00FF88;--purple:#BF00FF;--cyan:#00EEFF;--darker:#050508;--card:#0A0A18;--text:#F5F5F5;--muted:#6B7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--darker);color:var(--text);min-height:100vh;overflow-x:hidden;}
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:0 0 120px;}
.header{padding:48px 20px 24px;text-align:center;}
.header-mascot{font-size:72px;display:block;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(255,107,26,0.9));}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.header h1{font-family:'Bangers',cursive;font-size:54px;letter-spacing:5px;background:linear-gradient(135deg,var(--red),var(--orange),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin:8px 0 4px;}
.header-sub{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:5px;font-weight:700;}
.day-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.35);border-radius:20px;padding:7px 20px;font-size:15px;font-weight:900;color:var(--yellow);margin-top:16px;}
.section-title{font-family:'Bangers',cursive;font-size:18px;letter-spacing:3px;text-transform:uppercase;padding:0 20px 14px;display:flex;align-items:center;gap:10px;color:var(--muted);}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(255,45,75,0.4),transparent);}
.cards{padding:0 16px;display:flex;flex-direction:column;gap:16px;margin-bottom:32px;}
.card{background:var(--card);border-radius:24px;border:1px solid rgba(255,255,255,0.06);overflow:hidden;}
.card.validated{border-color:rgba(0,255,136,0.15);}
.card-band{height:3px;}
.card-cover{height:72px;display:flex;align-items:center;padding:0 20px;gap:14px;}
.player-name-big{font-family:'Bangers',cursive;font-size:26px;letter-spacing:2px;}
.card-body{padding:14px 20px 18px;}
.challenge-box{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:16px;margin-bottom:14px;}
.challenge-name{font-weight:900;font-size:17px;line-height:1.4;margin-bottom:8px;}
.spice-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,0.06);}
.card-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.done-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.check-box{width:36px;height:36px;border-radius:12px;border:2px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}
.check-box.checked{background:var(--green);border-color:var(--green);box-shadow:0 0 24px rgba(0,255,136,0.6);}
.btn-reroll{background:rgba(191,0,255,0.08);border:1px solid rgba(191,0,255,0.35);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:900;color:#e879f9;cursor:pointer;font-family:'Nunito',sans-serif;}
.btn-reroll:disabled{opacity:0.3;cursor:not-allowed;}
.divider{height:1px;background:linear-gradient(to right,transparent,rgba(255,45,75,0.2),transparent);margin:28px 16px;}
.leaderboard{padding:0 16px;}
.lb-card{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);}
.lb-header-row{display:grid;grid-template-columns:40px 1fr 64px 64px 56px;gap:8px;padding:12px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.04);}
.lb-header-row span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;text-align:center;font-weight:700;}
.lb-header-row span:nth-child(2){text-align:left;}
.lb-row{display:grid;grid-template-columns:40px 1fr 64px 64px 56px;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.03);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{font-family:'Bangers',cursive;font-size:22px;text-align:center;}
.lb-name{font-weight:900;font-size:14px;}
.lb-stat{text-align:center;}
.lb-val{font-weight:900;font-size:17px;}
.lb-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;position:relative;z-index:2;}
.spinner{width:48px;height:48px;border:2px solid rgba(255,45,75,0.15);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:3px;font-size:11px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);color:white;font-weight:900;padding:14px 28px;border-radius:50px;font-size:14px;z-index:9999;transition:transform 0.4s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<canvas id="particle-canvas"></canvas>
<div class="app">
<div id="root"><div class="loading"><div class="spinner"></div><p>Loading...</p></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var canvas=document.getElementById('particle-canvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var colors=['#FF2D4B','#FF6B1A','#FFD700','#00FF88','#00EEFF','#BF00FF'];
  var particles=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<50;i++){particles.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.5+0.3,color:colors[Math.floor(Math.random()*colors.length)],vx:(Math.random()-0.5)*0.3,vy:-Math.random()*0.4-0.1,alpha:Math.random()*0.5+0.1});}
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color+Math.floor(p.alpha*255).toString(16).padStart(2,'0');ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=canvas.height+5;p.x=Math.random()*canvas.width;}if(p.x<-5)p.x=canvas.width+5;if(p.x>canvas.width+5)p.x=-5;});requestAnimationFrame(draw);}
  draw();
})();

var CONFIG={
db_system:‘354403dde0e380aa85bfe7d9fd139be5’,
db_challenges:‘354403dde0e3804f8644d242a0ec6bf6’,
db_assignments:‘354403dde0e380f797ccfb85ad5a072e’
};
var PLAYERS=[
{name:‘Banuu’,emoji:’\u{1F335}’,color:’#00FF88’},
{name:‘Luzz’,emoji:’\u{1F525}’,color:’#FF2D4B’},
{name:‘Y’,emoji:’\u26A1’,color:’#FFD700’},
{name:‘Nicooo’,emoji:’\u{1F4B0}’,color:’#FF6B1A’}
];
var STATE={dayCounter:1,systemPageId:null,challenges:{},assignments:[],allChallengeIds:[],defiLaunched:false};

function query(dbId){
return fetch(’/api/notion/databases/’+dbId+’/query’,{method:‘POST’,headers:{‘Content-Type’:‘application/json’},body:’{}’}).then(function(r){return r.json();}).then(function(d){return d.results;});
}
function getProp(page,name,type){
var p=page.properties[name];
if(!p)return null;
if(type===‘number’)return p.number!=null?p.number:0;
if(type===‘title’)return p.title&&p.title[0]?p.title[0].plain_text:’’;
if(type===‘checkbox’)return p.checkbox===true;
if(type===‘formula_number’)return p.formula?p.formula.number||0:0;
if(type===‘formula_string’)return p.formula?p.formula.string||’’:’’;
if(type===‘select’)return p.select?p.select.name||’’:’’;
if(type===‘text’)return p.rich_text&&p.rich_text[0]?p.rich_text[0].plain_text:’’;
return null;
}
function showToast(msg,color){
var t=document.getElementById(‘toast’);
t.textContent=msg;t.style.background=color||’#00FF88’;
t.classList.add(‘show’);
setTimeout(function(){t.classList.remove(‘show’);},3000);
}

function render(){
var lb=STATE.assignments.slice().sort(function(a,b){return b.totalScore-a.totalScore;});
var medals=[’\u{1F947}’,’\u{1F948}’,’\u{1F949}’,‘4’];
var html=’<div class="header"><span class="header-mascot">\u{1F336}\uFE0F</span><h1>ZEST YOUR DAY</h1><div class="header-sub">Mexico Edition</div><div class="day-badge">Day ‘+STATE.dayCounter+’</div></div>’;
html+=’<div class="section-title">Challenges</div><div class="cards">’;
STATE.assignments.forEach(function(asg){
var player=PLAYERS[asg.playerIndex]||{name:’?’,emoji:’?’,color:’#fff’};
var cid=asg.rerollChallengeId>0?asg.rerollChallengeId:asg.challengeId;
var ch=STATE.challenges[cid]||{name:’?’,points:0,spice:’’};
html+=’<div class="card '+(asg.isValidated?'validated':'')+'">’
+’<div class="card-band" style="background:'+player.color+'"></div>’
+’<div class="card-cover"><span style="font-size:36px">’+player.emoji+’</span><span class="player-name-big" style="color:'+player.color+'">’+player.name+’</span></div>’
+’<div class="card-body"><div class="challenge-box">’
+’<div class="challenge-name">’+ch.name+’</div>’
+’<span class="spice-badge">’+ch.spice+’ - ‘+ch.points+‘pts</span>’
+’</div>’
+’<div class="card-actions">’
+’<div style="display:flex;align-items:center;gap:8px"><span class="done-label">Done?</span>’
+’<div class="check-box'+(asg.isValidated?' checked':'')+'" onclick="toggleValidation(\''+asg.pageId+'\','+asg.isValidated+')">’+(asg.isValidated?’\u2713’:’’)+’</div></div>’
+’<button class=“btn-reroll” onclick=“reroll('’+asg.pageId+’')” ‘+(asg.hasRerolled?‘disabled’:’’)+’>Reroll</button>’
+’</div></div></div>’;
});
html+=’</div>’;
html+=’<div class="divider"></div>’;
html+=’<div class="section-title">Leaderboard</div>’;
html+=’<div class="leaderboard"><div class="lb-card">’;
html+=’<div class="lb-header-row"><span>#</span><span>Player</span><span>Score</span><span>Streak</span><span>Done</span></div>’;
lb.forEach(function(asg,i){
var player=PLAYERS[asg.playerIndex]||{name:’?’,emoji:’?’,color:’#fff’};
html+=’<div class="lb-row">’
+’<div class="lb-rank">’+(medals[i]||i+1)+’</div>’
+’<div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">’+player.emoji+’</span><span class="lb-name" style="color:'+player.color+'">’+player.name+’</span></div>’
+’<div class="lb-stat"><div class="lb-val" style="color:#FFD700">’+asg.totalScore+’</div><div class="lb-lbl">pts</div></div>’
+’<div class="lb-stat"><div class="lb-val" style="color:#FF6B1A">’+asg.winStreak+’</div><div class="lb-lbl">streak</div></div>’
+’<div class="lb-stat"><div class="lb-val" style="color:#00FF88">’+asg.defisReussis+’</div><div class="lb-lbl">done</div></div>’
+’</div>’;
});
html+=’</div></div>’;
document.getElementById(‘root’).innerHTML=html;
}

window.toggleValidation=function(pageId,cur){
var nv=!cur;
fetch(’/api/notion/pages/’+pageId,{method:‘PATCH’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({properties:{Is_Validated:{checkbox:nv}}})}).then(function(){
var a=STATE.assignments.find(function(x){return x.pageId===pageId;});
if(a)a.isValidated=nv;
render();
showToast(nv?‘Challenge done!’:‘Removed’,nv?’#00FF88’:’#FF2D4B’);
});
};
window.reroll=function(pageId){
var asg=STATE.assignments.find(function(a){return a.pageId===pageId;});
if(!asg||asg.hasRerolled)return;
var current=asg.rerollChallengeId>0?asg.rerollChallengeId:asg.challengeId;
var available=STATE.allChallengeIds.filter(function(id){return id!==current;});
if(available.length===0){showToast(‘No other challenges!’,’#FF6B1A’);return;}
var newId=available[Math.floor(Math.random()*available.length)];
fetch(’/api/notion/pages/’+pageId,{method:‘PATCH’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({properties:{Has_Rerolled:{checkbox:true},Reroll_Challenge_ID:{number:newId}}})}).then(function(){
asg.hasRerolled=true;asg.rerollChallengeId=newId;
render();showToast(‘Rerolled!’,’#BF00FF’);
});
};

function loadData(){
return query(CONFIG.db_system).then(function(sysPages){
var sys=sysPages[0];
STATE.systemPageId=sys.id;
STATE.dayCounter=getProp(sys,‘Day_Counter’,‘number’)||1;
STATE.defiLaunched=getProp(sys,‘Defis_Launched’,‘checkbox’);
return query(CONFIG.db_challenges);
}).then(function(chPages){
STATE.challenges={};STATE.allChallengeIds=[];
for(var i=0;i<chPages.length;i++){
var p=chPages[i];
var id=getProp(p,‘ID_Global’,‘number’);
STATE.challenges[id]={id:id,name:getProp(p,‘Name’,‘title’),points:getProp(p,‘Points’,‘number’)||0,spice:getProp(p,‘Spice_Level’,‘formula_string’)||getProp(p,‘Spice_Level’,‘select’)||’’};
STATE.allChallengeIds.push(id);
}
return query(CONFIG.db_assignments);
}).then(function(asgPages){
STATE.assignments=asgPages.map(function(p){
return{
pageId:p.id,
playerIndex:getProp(p,‘Player_Index’,‘number’)||0,
winStreak:getProp(p,‘Win_Streak’,‘number’)||0,
totalScore:getProp(p,‘Total_Score’,‘number’)||0,
defisReussis:getProp(p,‘Defis_Reussis’,‘number’)||0,
isValidated:getProp(p,‘Is_Validated’,‘checkbox’),
challengeId:getProp(p,‘Challenge_ID_Today’,‘formula_number’)||0,
hasRerolled:getProp(p,‘Has_Rerolled’,‘checkbox’),
rerollChallengeId:getProp(p,‘Reroll_Challenge_ID’,‘number’)||0,
powerType:getProp(p,‘Power_Type’,‘select’)||‘None’,
powerUsed:getProp(p,‘Power_Used’,‘checkbox’)
};
}).sort(function(a,b){return a.playerIndex-b.playerIndex;});
render();
});
}

loadData().catch(function(e){
document.getElementById(‘root’).innerHTML=’<div style="padding:20px;color:#FF2D4B">ERROR: ‘+e.message+’</div>’;
});
</script>

</body>
</html>
