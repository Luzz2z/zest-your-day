// PARTICLES
(function(){
  const canvas=document.getElementById('particle-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const colors=['#FF2D4B','#FF6B1A','#FFD700','#00FF88','#00EEFF','#BF00FF'];
  let particles=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<50;i++){particles.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.5+0.3,color:colors[Math.floor(Math.random()*colors.length)],vx:(Math.random()-0.5)*0.3,vy:-Math.random()*0.4-0.1,alpha:Math.random()*0.5+0.1});}
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color+Math.floor(p.alpha*255).toString(16).padStart(2,'0');ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=canvas.height+5;p.x=Math.random()*canvas.width;}if(p.x<-5)p.x=canvas.width+5;if(p.x>canvas.width+5)p.x=-5;});requestAnimationFrame(draw);}
  draw();
})();

async function notionQuery(dbId,body={}){
const res=await fetch(’/api/notion?endpoint=databases/’+dbId+’/query’,{method:‘POST’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify(body)});
const data=await res.json();if(!res.ok)throw new Error(data.message||‘Notion error’);return data.results;
}
async function notionPatch(pageId,properties){
const res=await fetch(’/api/notion?endpoint=pages/’+pageId,{method:‘PATCH’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({properties})});
const data=await res.json();if(!res.ok)throw new Error(data.message||‘Update error’);return data;
}
async function notionCreate(dbId,properties){
const res=await fetch(’/api/notion?endpoint=pages’,{method:‘POST’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({parent:{database_id:dbId},properties})});
const data=await res.json();if(!res.ok)throw new Error(data.message||‘Create error’);return data;
}
function getProp(page,name,type){
const p=page.properties[name];if(!p)return null;
if(type===‘number’)return p.number??0;
if(type===‘title’)return p.title?.[0]?.plain_text??’’;
if(type===‘checkbox’)return p.checkbox??false;
if(type===‘formula_number’)return p.formula?.number??0;
if(type===‘formula_string’)return p.formula?.string??’’;
if(type===‘select’)return p.select?.name??’’;
if(type===‘text’)return p.rich_text?.[0]?.plain_text??’’;
return null;
}
function showToast(msg,color){
const t=document.getElementById(‘toast’);
t.textContent=msg;t.style.background=color||’#00FF88’;
t.style.boxShadow=`0 0 30px ${color||'#00FF88'}80`;
t.classList.add(‘show’);setTimeout(()=>t.classList.remove(‘show’),3000);
}

let STATE={
dayCounter:1,systemPageId:null,challenges:{},assignments:[],allChallengeIds:[],
defiLaunched:false,
// Reveal flow
revealPhase:false,
revealOrder:[],
revealStep:0,
effectLog:[],
pendingShield:null,
selectedTarget:null,
selectedUpgradeDir:null,
};

async function loadData(){
const sysPages=await notionQuery(CONFIG.db_system);
const sys=sysPages[0];
STATE.systemPageId=sys.id;
STATE.dayCounter=getProp(sys,‘Day_Counter’,‘number’);
STATE.defiLaunched=getProp(sys,‘Defis_Launched’,‘checkbox’);

const chPages=await notionQuery(CONFIG.db_challenges);
STATE.challenges={};STATE.allChallengeIds=[];
for(const p of chPages){
const id=getProp(p,‘ID_Global’,‘number’);
const status=getProp(p,‘Status’,‘select’);
if(status===‘✅ Active’||!status){
STATE.challenges[id]={id,name:getProp(p,‘Name’,‘title’),points:getProp(p,‘Points’,‘number’),spice:getProp(p,‘Spice_Level’,‘formula_string’)||getProp(p,‘Spice_Level’,‘select’)};
STATE.allChallengeIds.push(id);
}
}

const asgPages=await notionQuery(CONFIG.db_assignments);
STATE.assignments=asgPages.map(p=>({
pageId:p.id,name:getProp(p,‘Name’,‘title’),playerIndex:getProp(p,‘Player_Index’,‘number’),
winStreak:getProp(p,‘Win_Streak’,‘number’),totalScore:getProp(p,‘Total_Score’,‘number’),
defisReussis:getProp(p,‘Defis_Reussis’,‘number’),isValidated:getProp(p,‘Is_Validated’,‘checkbox’),
challengeId:getProp(p,‘Challenge_ID_Today’,‘formula_number’),
hasRerolled:getProp(p,‘Has_Rerolled’,‘checkbox’),
rerollChallengeId:getProp(p,‘Reroll_Challenge_ID’,‘number’),
powerType:getProp(p,‘Power_Type’,‘select’)||‘❌ None’,
powerTarget:getProp(p,‘Power_Target’,‘text’)||’’,
powerUsed:getProp(p,‘Power_Used’,‘checkbox’),
rouletteMultiplier:getProp(p,‘Roulette_Multiplier’,‘number’)||1,
shieldUsedToday:getProp(p,‘Shield_Used_Today’,‘checkbox’)||false,
effectBridage:false,
effectUpgrade:null,
effectExtinct:false,
})).sort((a,b)=>a.playerIndex-b.playerIndex);

// Rebuild effect log from Notion data
STATE.effectLog=[];
for(const asg of STATE.assignments){
if(asg.powerUsed&&asg.powerType&&asg.powerType!==‘❌ None’&&POWERS[asg.powerType]){
const player=PLAYERS[asg.playerIndex];
const power=POWERS[asg.powerType];
let msg=`${player?.emoji} ${player?.name} activated ${asg.powerType}`;
if(asg.powerTarget)msg+=` on ${asg.powerTarget}`;
STATE.effectLog.push({msg,color:power.color});
// Restore local effects
if(asg.powerType===‘💀 Bridage’){
const targetAsg=asg.powerTarget===‘myself’?asg:STATE.assignments.find(a=>PLAYERS[a.playerIndex]?.name===asg.powerTarget);
if(targetAsg)targetAsg.effectBridage=true;
}
if(asg.powerType===‘⚡ Pas si vite’&&asg.powerTarget){
const targetAsg=STATE.assignments.find(a=>PLAYERS[a.playerIndex]?.name===asg.powerTarget);
// upgradeDir stored in powerTarget as “name:dir” — simplified: check Notion
}
}
}

// If not launched yet, check if we should be in reveal phase
if(!STATE.defiLaunched&&STATE.assignments.some(a=>a.powerType&&a.powerType!==‘❌ None’)){
// Powers were assigned but not yet fully revealed
const allUsed=STATE.assignments.every(a=>a.powerUsed||a.powerType===‘❌ None’);
if(!allUsed&&!STATE.revealPhase){
// Re-enter reveal phase
const order=[];
for(let i=0;i<PLAYERS.length;i++)order.push((i+STATE.dayCounter-1)%PLAYERS.length);
STATE.revealOrder=order;
// Find first not yet processed step
let step=0;
for(let s=0;s<order.length;s++){
const asg=STATE.assignments.find(a=>a.playerIndex===order[s]);
if(asg&&!asg.powerUsed)break;
step=s+1;
}
STATE.revealStep=step;
STATE.revealPhase=true;
}
}
}

function getBaseChallenge(asg){return(asg.rerollChallengeId&&asg.rerollChallengeId>0)?asg.rerollChallengeId:asg.challengeId;}

function getEffectiveChallengeId(asg){
const playerName=PLAYERS[asg.playerIndex]?.name;
const swapper=STATE.assignments.find(a=>a.powerUsed&&a.powerType===‘🔄 Swap’&&a.powerTarget===playerName&&a.playerIndex!==asg.playerIndex);
if(swapper)return getBaseChallenge(swapper);
if(asg.powerUsed&&asg.powerType===‘🔄 Swap’&&asg.powerTarget){
const target=STATE.assignments.find(a=>PLAYERS[a.playerIndex]?.name===asg.powerTarget);
if(target)return getBaseChallenge(target);
}
if(asg.powerUsed&&asg.powerType===‘🦹 Entourloupeur’&&asg.powerTarget){
const target=STATE.assignments.find(a=>PLAYERS[a.playerIndex]?.name===asg.powerTarget);
if(target)return getBaseChallenge(target);
}
const copier=STATE.assignments.find(a=>a.powerUsed&&a.powerType===‘👯 Copier-Coller’&&a.powerTarget===playerName&&a.playerIndex!==asg.playerIndex);
if(copier)return getBaseChallenge(copier);
return getBaseChallenge(asg);
}

function getEffectiveSpice(asg){
const effectiveId=getEffectiveChallengeId(asg);
const challenge=STATE.challenges[effectiveId];
if(!challenge)return null;
let spice=challenge.spice;
if(asg.effectUpgrade&&spice){
const clean=SPICE_ORDER.find(s=>spice.includes(s.replace(/[^ ]+ /,’’)));
const idx=clean?SPICE_ORDER.indexOf(clean):-1;
if(idx>=0){
const newIdx=asg.effectUpgrade===‘upgrade’?Math.min(idx+1,3):Math.max(idx-1,0);
spice=SPICE_ORDER[newIdx];
}
}
return spice;
}

function getEffectivePts(asg){
const spice=getEffectiveSpice(asg);
const effectiveId=getEffectiveChallengeId(asg);
let pts=spice?SPICE_PTS[spice]:(STATE.challenges[effectiveId]?.points??0);
if(asg.effectBridage)pts=Math.ceil(pts*0.5);
return pts;
}

async function doActivatePower(asg,target,upgradeDir){
const player=PLAYERS[asg.playerIndex];
const power=POWERS[asg.powerType];
const color=power.color;
let updates={Power_Used:{checkbox:true}};
if(target)updates.Power_Target={rich_text:[{text:{content:target}}]};

if(asg.powerType===‘🔥 Extincteur’&&target&&target!==‘myself’){
const targetAsg=STATE.assignments.find(a=>PLAYERS[a.playerIndex]?.name===target);
if(targetAsg){await notionPatch(targetAsg.pageId,{Win_Streak:{number:0}});targetAsg.winStreak=0;targetAsg.effectExtinct=true;}
STATE.effectLog.push({msg:`🔥 ${player.emoji} ${player.name} extinguished ${target}'s streak! 🧊`,color});
}
if(asg.powerType===‘💀 Bridage’){
const targetAsg=target===‘myself’?asg:STATE.assignments.find(a=>PLAYERS[a.playerIndex]?.name===target);
if(targetAsg)targetAsg.effectBridage=true;
STATE.effectLog.push({msg:`💀 ${player.emoji} ${player.name} bridaged ${target==='myself'?'themselves':target}! (×0.5 pts)`,color});
}
if(asg.powerType===‘⚡ Pas si vite’&&target&&upgradeDir){
const targetAsg=STATE.assignments.find(a=>PLAYERS[a.playerIndex]?.name===target);
if(targetAsg)targetAsg.effectUpgrade=upgradeDir;
// Store upgradeDir in power target as “name|dir”
updates.Power_Target={rich_text:[{text:{content:target+’|’+upgradeDir}}]};
STATE.effectLog.push({msg:`⚡ ${player.emoji} ${player.name} ${upgradeDir}d ${target}'s challenge!`,color});
}
if(asg.powerType===‘🎰 Roulette’){
const mult=[0,1,2][Math.floor(Math.random()*3)];
updates.Roulette_Multiplier={number:mult};
asg.rouletteMultiplier=mult;
STATE.effectLog.push({msg:`🎰 ${player.emoji} ${player.name} rolled ×${mult}!`,color:mult===2?’#00FF88’:mult===0?’#FF2D4B’:’#FFD700’});
}
if(![‘🔥 Extincteur’,‘💀 Bridage’,‘⚡ Pas si vite’,‘🎰 Roulette’].includes(asg.powerType)){
const targetName=target&&target!==‘myself’?target:’’;
STATE.effectLog.push({msg:`${player.emoji} ${player.name} activated ${asg.powerType}${targetName?' on '+targetName:''}!`,color});
}

await notionPatch(asg.pageId,updates);
asg.powerUsed=true;asg.powerTarget=target||’’;
STATE.selectedTarget=null;STATE.selectedUpgradeDir=null;
await nextRevealStep();
}

// Reroll during reveal phase
window.rerollReveal=async function(pageId){
const asg=STATE.assignments.find(a=>a.pageId===pageId);
if(!asg||asg.hasRerolled)return;
const current=getEffectiveChallengeId(asg);
const available=STATE.allChallengeIds.filter(id=>id!==current);
if(available.length===0){showToast(‘No other challenges!’,’#FF6B1A’);return;}
const newId=available[Math.floor(Math.random()*available.length)];
await notionPatch(pageId,{
Has_Rerolled:{checkbox:true},
Reroll_Challenge_ID:{number:newId},
Power_Type:{select:{name:‘❌ None’}},
Power_Used:{checkbox:false},
});
asg.hasRerolled=true;asg.rerollChallengeId=newId;asg.powerType=‘❌ None’;
showToast(‘🎲 Rerolled! Power lost! 💀’,’#BF00FF’);
await nextRevealStep();
};
