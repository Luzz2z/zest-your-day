<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zest Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#FF2D4B;--orange:#FF6B1A;--yellow:#FFD700;--green:#00FF88;--cyan:#00EEFF;--darker:#050508;--card:#0A0A18;--text:#F5F5F5;--muted:#6B7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--darker);color:var(--text);min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding:0 0 100px;}
.header{padding:40px 20px 20px;text-align:center;}
.header-mascot{font-size:56px;display:block;}
.header h1{font-family:'Bangers',cursive;font-size:40px;letter-spacing:4px;background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0 4px;}
.header-sub{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:3px;font-weight:700;}
.day-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.35);border-radius:20px;padding:6px 18px;font-size:14px;font-weight:900;color:var(--yellow);margin-top:12px;}
.section-title{font-family:'Bangers',cursive;font-size:16px;letter-spacing:2px;text-transform:uppercase;padding:0 20px 12px;display:flex;align-items:center;gap:8px;color:var(--muted);}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(255,45,75,0.3),transparent);}
.btn-launch{display:block;width:calc(100% - 32px);margin:0 16px 10px;background:linear-gradient(135deg,var(--green),#1db954);border:none;border-radius:16px;padding:18px;font-family:'Bangers',cursive;font-size:22px;letter-spacing:3px;color:#000;cursor:pointer;}
.btn-launch:disabled{opacity:0.4;cursor:not-allowed;}
.btn-nextday{display:block;width:calc(100% - 32px);margin:0 16px 16px;background:linear-gradient(135deg,var(--red),var(--orange));border:none;border-radius:16px;padding:18px;font-family:'Bangers',cursive;font-size:22px;letter-spacing:3px;color:white;cursor:pointer;}
.btn-nextday:disabled{opacity:0.4;cursor:not-allowed;}
.info-box{margin:0 16px 16px;background:rgba(0,238,255,0.05);border:1px solid rgba(0,238,255,0.2);border-radius:14px;padding:12px 16px;font-size:13px;color:var(--cyan);font-weight:700;}
.warning-box{margin:0 16px 16px;background:rgba(255,107,26,0.05);border:1px solid rgba(255,107,26,0.2);border-radius:14px;padding:12px 16px;font-size:12px;color:var(--muted);line-height:1.6;}
.player-row{background:var(--card);border-radius:16px;margin:0 16px 10px;padding:14px 16px;border:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.player-row.validated{border-color:rgba(0,255,136,0.2);}
.player-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.player-info{flex:1;min-width:0;}
.player-name-row{font-weight:900;font-size:15px;margin-bottom:2px;}
.player-challenge-row{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-power-row{font-size:11px;font-weight:700;margin-top:3px;}
.player-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.score-box{text-align:center;}
.score-val{font-weight:900;font-size:16px;color:var(--yellow);}
.score-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;}
.check-box{width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;}
.check-box.checked{background:var(--green);border-color:var(--green);box-shadow:0 0 16px rgba(0,255,136,0.5);}
.divider{height:1px;background:linear-gradient(to right,transparent,rgba(255,45,75,0.2),transparent);margin:20px 16px;}
.back-link{display:block;text-align:center;color:var(--muted);font-size:13px;font-weight:700;text-decoration:none;padding:16px;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:16px;}
.spinner{width:40px;height:40px;border:2px solid rgba(255,45,75,0.15);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:11px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);color:white;font-weight:900;padding:12px 24px;border-radius:40px;font-size:14px;z-index:999;transition:transform 0.3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
<div id="root"><div class="loading"><div class="spinner"></div><p>Loading...</p></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var CONFIG={
  db_system:'354403dde0e380aa85bfe7d9fd139be5',
  db_challenges:'354403dde0e3804f8644d242a0ec6bf6',
  db_assignments:'354403dde0e380f797ccfb85ad5a072e'
};
var PLAYERS=[
  {name:'Banuu',emoji:'\u{1F335}',color:'#00FF88'},
  {name:'Luzz',emoji:'\u{1F525}',color:'#FF2D4B'},
  {name:'Y',emoji:'\u26A1',color:'#FFD700'},
  {name:'Nicooo',emoji:'\u{1F4B0}',color:'#FF6B1A'}
];
var ALL_POWERS=['\u{1F9B9} Entourloupeur','\u{1F504} Swap','\u{1F480} Bridage','\u26A1 Pas si vite','\u{1F6E1}\uFE0F Shield','\u{1F3B0} Roulette','\u{1F46F} Copier-Coller','\u{1F525} Extincteur'];
var STATE={dayCounter:1,sysId:null,challenges:{},players:[],ids:[],launched:false};

function query(dbId){
  return fetch('/api/notion/databases/'+dbId+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json();}).then(function(d){return d.results;});
}
function patch(pageId,props){
  return fetch('/api/notion/pages/'+pageId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({properties:props})}).then(function(r){return r.json();});
}
function getProp(page,name,type){
  var p=page.properties[name];
  if(!p)return null;
  if(type==='number')return p.number!=null?p.number:0;
  if(type==='title')return p.title&&p.title[0]?p.title[0].plain_text:'';
  if(type==='checkbox')return p.checkbox===true;
  if(type==='formula_number')return p.formula?p.formula.number||0:0;
  if(type==='formula_string')return p.formula?p.formula.string||'':'';
  if(type==='select')return p.select?p.select.name||'':'';
  if(type==='text')return p.rich_text&&p.rich_text[0]?p.rich_text[0].plain_text:'';
  return null;
}
function showToast(msg,color){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color||'#00FF88';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3000);
}

window.toggleValidation=function(pageId,cur){
  var nv=!cur;
  patch(pageId,{Is_Validated:{checkbox:nv}}).then(function(){
    var a=STATE.players.find(function(x){return x.pageId===pageId;});
    if(a)a.isValidated=nv;
    render();
    showToast(nv?'Validated!':'Removed',nv?'#00FF88':'#FF2D4B');
  });
};

window.launchDay=function(){
  var btn=document.getElementById('btn-launch');
  if(btn)btn.disabled=true;
  var nonShield=ALL_POWERS.filter(function(p){return p.indexOf('Shield')<0;});
  var shuffled=nonShield.slice().sort(function(){return Math.random()-0.5;});
  var shieldIdx=Math.floor(Math.random()*PLAYERS.length);
  var powers=PLAYERS.map(function(_,i){
    if(i===shieldIdx)return '\u{1F6E1}\uFE0F Shield';
    var off=i<shieldIdx?i:i-1;
    return shuffled[off]||shuffled[0];
  });
  var chain=Promise.resolve();
  STATE.players.forEach(function(a){
    var power=powers[a.playerIndex]||'\u274C None';
    chain=chain.then(function(){
      return patch(a.pageId,{
        Power_Type:{select:{name:power}},
        Power_Used:{checkbox:false},
        Power_Target:{rich_text:[{text:{content:''}}]},
        Roulette_Multiplier:{number:1}
      });
    }).then(function(){a.powerType=power;});
  });
  chain.then(function(){
    showToast('Powers assigned!','#00FF88');
    render();
  }).catch(function(e){
    showToast('Error: '+e.message,'#FF2D4B');
    if(btn)btn.disabled=false;
  });
};

window.nextDay=function(){
  var btn=document.getElementById('btn-nextday');
  if(btn)btn.disabled=true;
  var chain=Promise.resolve();
  STATE.players.forEach(function(a){
    chain=chain.then(function(){
      var cid=a.rerollId>0?a.rerollId:a.challengeId;
      var ch=STATE.challenges[cid]||{pts:0};
      var pts=a.isValidated?ch.pts:0;
      var bonus=a.isValidated?(a.winStreak>=10?3:a.winStreak>=5?2:a.winStreak>=3?1:0):0;
      return patch(a.pageId,{
        Total_Score:{number:a.totalScore+(a.isValidated?pts+bonus:0)},
        Win_Streak:{number:a.isValidated?a.winStreak+1:0},
        Defis_Reussis:{number:a.isValidated?a.defisReussis+1:a.defisReussis},
        Is_Validated:{checkbox:false},
        Has_Rerolled:{checkbox:false},
        Reroll_Challenge_ID:{number:0},
        Power_Type:{select:{name:'\u274C None'}},
        Power_Used:{checkbox:false},
        Power_Target:{rich_text:[{text:{content:''}}]},
        Roulette_Multiplier:{number:1},
        Shield_Used_Today:{checkbox:false}
      });
    });
  });
  chain.then(function(){
    return patch(STATE.sysId,{Day_Counter:{number:STATE.dayCounter+1},Defis_Launched:{checkbox:false}});
  }).then(function(){
    showToast('Day '+(STATE.dayCounter+1)+' ready!','#FF6B1A');
    return loadAndRender();
  }).catch(function(e){
    showToast('Error: '+e.message,'#FF2D4B');
    if(btn)btn.disabled=false;
  });
};

function render(){
  var powersAssigned=STATE.players.some(function(a){return a.powerType&&a.powerType.indexOf('None')<0&&a.powerType.indexOf('\u274C')<0;});
  var html='';
  html+='<div class="header"><span class="header-mascot">\u2699\uFE0F</span><h1>ADMIN PANEL</h1><div class="header-sub">Game Master Only</div><div class="day-badge">Day '+STATE.dayCounter+'</div></div>';

  if(!powersAssigned&&!STATE.launched){
    html+='<button class="btn-launch" id="btn-launch" onclick="launchDay()">LAUNCH DAY</button>';
    html+='<div class="warning-box">Assigns random powers. Players then do the Morning Reveal on the main page.</div>';
  }
  if(powersAssigned&&!STATE.launched){
    html+='<div class="info-box">Powers assigned! Players are doing the Morning Reveal on the main page.</div>';
  }
  if(STATE.launched){
    html+='<div class="warning-box">Next Day saves all scores and resets for Day '+(STATE.dayCounter+1)+'.</div>';
    html+='<button class="btn-nextday" id="btn-nextday" onclick="nextDay()">NEXT DAY</button>';
  }

  html+='<div class="section-title">Validations</div>';
  STATE.players.forEach(function(a){
    var pl=PLAYERS[a.playerIndex]||{name:'?',emoji:'?',color:'#fff'};
    var cid=a.rerollId>0?a.rerollId:a.challengeId;
    var ch=STATE.challenges[cid]||{name:'?',pts:0};
    var hasPower=a.powerType&&a.powerType.indexOf('None')<0&&a.powerType.indexOf('\u274C')<0;
    html+='<div class="player-row'+(a.isValidated?' validated':'')+'">'
      +'<div class="player-left">'
      +'<span style="font-size:28px">'+pl.emoji+'</span>'
      +'<div class="player-info">'
      +'<div class="player-name-row" style="color:'+pl.color+'">'+pl.name+'</div>'
      +'<div class="player-challenge-row">'+ch.name+'</div>'
      +(hasPower?'<div class="player-power-row" style="color:#FFD700">'+a.powerType+(a.powerUsed?' (used)':'')+'</div>':'')
      +'</div></div>'
      +'<div class="player-right">'
      +'<div class="score-box"><div class="score-val">'+a.totalScore+'</div><div class="score-lbl">pts</div></div>'
      +'<div class="check-box'+(a.isValidated?' checked':'')+'" onclick="toggleValidation(\''+a.pageId+'\','+a.isValidated+')">'+(a.isValidated?'\u2713':'')+'</div>'
      +'</div></div>';
  });

  html+='<div class="divider"></div>';
  html+='<a href="/" class="back-link">Back to player view</a>';
  document.getElementById('root').innerHTML=html;
}

function loadAndRender(){
  return query(CONFIG.db_system).then(function(sys){
    STATE.sysId=sys[0].id;
    STATE.dayCounter=getProp(sys[0],'Day_Counter','number')||1;
    STATE.launched=getProp(sys[0],'Defis_Launched','checkbox');
    return query(CONFIG.db_challenges);
  }).then(function(chs){
    chs.forEach(function(p){
      var id=getProp(p,'ID_Global','number');
      if(!id)return;
      STATE.challenges[id]={name:getProp(p,'Name','title')||'',pts:getProp(p,'Points','number')||0};
    });
    return query(CONFIG.db_assignments);
  }).then(function(asgs){
    STATE.players=asgs.map(function(p){
      return{
        pageId:p.id,
        playerIndex:getProp(p,'Player_Index','number')||0,
        winStreak:getProp(p,'Win_Streak','number')||0,
        totalScore:getProp(p,'Total_Score','number')||0,
        defisReussis:getProp(p,'Defis_Reussis','number')||0,
        isValidated:getProp(p,'Is_Validated','checkbox'),
        challengeId:getProp(p,'Challenge_ID_Today','formula_number')||0,
        hasRerolled:getProp(p,'Has_Rerolled','checkbox'),
        rerollId:getProp(p,'Reroll_Challenge_ID','number')||0,
        powerType:getProp(p,'Power_Type','select')||'',
        powerUsed:getProp(p,'Power_Used','checkbox')
      };
    }).sort(function(a,b){return a.playerIndex-b.playerIndex;});
    render();
  });
}

loadAndRender().catch(function(e){
  document.getElementById('root').innerHTML='<div style="padding:20px;color:#FF2D4B;font-weight:700">ERROR: '+e.message+'</div>';
});
</script>
</body>
</html>
